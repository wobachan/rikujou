/* ---------- 会員：自分の子の申し込みカード ---------- */
function MemberApplyCard(ev){
  const road = ev.type==='road', ekiden = ev.type==='ekiden', club = roadIsClub(ev);
  const head = road?(club?'（参加を回答）':'（部門を報告）'):(ekiden?'（出場の意思を回答）':'');
  const sub = road?(club?'団を通して申し込みます。参加の可否と部門をお知らせください。':'申込は各家庭で主催者へ。団へは部門を報告します。')
    : ekiden?'出場の意思を回答します。チーム編成・区間は当日コーチ陣が行います。'
    : 'お子さんごとに回答できます。';
  const card=el(`<div class="card edge-member"><h3>🏆 参加申し込み${head}</h3><p class="sub">${sub}</p></div>`);
  const mine=childrenOfGuardian(Session.user().guardianId);
  if(!mine.length){ card.appendChild(el(`<div class="note note-info">お子さんの情報がありません。</div>`)); return card; }
  const open = ev.status==='open';
  mine.forEach(c=>{
    const st=childAnswerState(ev,c); const a=ANSWER[st]; const p=getParticipation(ev.id,c.id);
    let detail='';
    if(st==='participate'&&p){
      detail = road ? ' ・ '+esc(p.category||'部門未選択')
        : ekiden ? ' ・ '+esc(ekidenLabel(p.ekidenWish))
        : ' ・ '+esc((p.events||[]).join('・')||'種目未選択')+(p.relay&&p.relay!=='no'?' ・リレー希望':'');
    }
    card.appendChild(el(`<div class="row" style="cursor:default;margin-top:8px">
      <div class="main"><b>${esc(nameNo(c))}</b><small>${c.grade}年${detail}</small></div>
      <span class="badge ${a.cls}">${esc(answerLabel(ev,st))}</span></div>`));
    if(st==='ineligible'){
      card.appendChild(el(`<div class="hint" style="margin:2px 0 6px">この大会は「${esc(resolveRule(ev,'eligibility'))}」のため対象外です。</div>`));
    }else if(open){
      const first = st==='notanswered';
      const lbl = (road && !club) ? (first?'申込を報告する':'報告を変更する')
        : ekiden ? (first?'出場を回答する':'回答を変更する')
        : (first?'回答する':'回答を変更する');
      const b=el(`<button class="btn ${first?'btn-primary':''}" style="width:100%;margin:2px 0 6px">${lbl}</button>`);
      b.onclick=()=>go('apply',{eventId:ev.id, childId:c.id});
      card.appendChild(b);
    }else{
      card.appendChild(el(`<div class="hint" style="margin:2px 0 6px">現在（${EVENT_STATUS[ev.status]}）は受け付けていません。</div>`));
    }
  });
  return card;
}

/* ---------- 申し込みフォーム（大会ルールに応じて自動変化 #58） ---------- */
function ApplyScreen(){
  const { eventId, childId } = route.params;
  const ev=getEvent(eventId), child=getChild(childId);
  const box=el('<div class="stack"></div>');
  if(!ev||!child){ box.appendChild(el(`<div class="note note-warn">見つかりません。</div>`)); return box; }
  const isOwn = childrenOfGuardian(Session.user().guardianId).some(c=>c.id===child.id);
  const isProxy = Session.can('officer');
  if(!isOwn && !isProxy){ box.appendChild(el(`<div class="note note-warn">自分のお子さんのみ回答できます。</div>`)); return box; }

  box.appendChild(el(`<div class="card"><h2>${esc(nameNo(child))}（${child.grade}年）</h2>
    <p class="sub">${esc(ev.name)}　${fmtDate(ev.date)}</p></div>`));

  // 対象外
  const grades=eligibleGrades(resolveRule(ev,'eligibility'));
  if(!grades.includes(child.grade)){
    box.appendChild(el(`<div class="note note-warn">この大会は「${esc(resolveRule(ev,'eligibility'))}」のため<b>対象外</b>です。申し込みはできません。</div>`));
    return box;
  }

  const p=getParticipation(eventId,childId);

  // ===== ロードレース：部門を報告する（種目・リレー・出場制限なし） =====
  if(ev.type==='road'){
    const club=roadIsClub(ev);
    const form=el(`<div class="card edge-member"></div>`); box.appendChild(form);
    form.appendChild(el(`<div class="note note-info">${club?'この大会は<b>団を通して申し込みます</b>。参加の可否と部門をお知らせください。'+(ev.feeFlat!=null?`参加費は1人 ${ev.feeFlat.toLocaleString()}円です。`:''):'申込は各家庭で主催者へ行い、ここでは「どの部門に申し込んだか」を団へ報告します。参加費は団では徴収しません。'}</div>`));
    form.appendChild(el(`<label class="f">${club?'参加しますか？':'主催者へ申し込みましたか？'}</label>`));
    const toggle=el(`<div class="btn-row" style="margin-bottom:4px"></div>`);
    const rYes=el(`<button class="btn big">${club?'参加する':'申し込みました'}</button>`);
    const rNo=el(`<button class="btn big">参加しない</button>`);
    toggle.append(rYes,rNo); form.appendChild(toggle);
    const rbody=el(`<div></div>`); form.appendChild(rbody);
    const auto=autoCategory(ev,child); const preselect=(p&&p.category)||auto||'';
    let catArr=categoriesForEvent(ev).slice(); if(preselect && !catArr.includes(preselect)) catArr.unshift(preselect);
    const catOpts=catArr.map(c=>`<option value="${esc(c)}" ${c===preselect?'selected':''}>${esc(c)}</option>`).join('');
    const catLabel=(ev.categoryRule&&ev.categoryRule!=='manual')?'部門（学年・性別から自動判定・変更できます）':'部門（申し込んだ「◯◯の部」）';
    rbody.appendChild(el(`<div><label class="f">${catLabel}</label>
      <select class="f" id="roadCat">${catOpts||'<option value="">（部門が未設定です）</option>'}</select></div>`));
    const rAttend=el(`<div><label class="f">帯同（保護者の付き添い）</label><div class="at"></div></div>`);
    [['yes','できる'],['no','できない']].forEach(([v,l])=>{ const ck=(p?p.attend:'yes')===v;
      rAttend.querySelector('.at').appendChild(el(`<label style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="radio" name="rattend" value="${v}" ${ck?'checked':''} style="width:20px;height:20px"> <span>${esc(l)}</span></label>`)); });
    rbody.appendChild(rAttend);

    const rRec=el(`<div style="margin-top:8px"></div>`);
    if(isProxy){ const cur=(p?p.enteredBy:Session.userId);
      rRec.innerHTML=`<label class="f">記入者（代理入力の場合は変更）</label><select class="f" id="rRecBy">${DB.users.map(u=>`<option value="${u.id}" ${u.id===cur?'selected':''}>${esc(u.name)}（${ROLE[u.role].label}）</option>`).join('')}</select><div class="hint">最終更新日時は自動記録されます。</div>`;
    }else{ rRec.innerHTML=`<label class="f">記入者</label><input class="f" value="${esc(Session.user().name)}" disabled><div class="hint">記入者はあなた自身になります。</div>`; }
    form.appendChild(rRec);
    const rRecBy=()=> isProxy ? form.querySelector('#rRecBy').value : Session.userId;

    let joined = p ? (p.status==='participate') : null;
    const syncR=()=>{ rYes.style.cssText='flex:1'+(joined===true?';background:var(--c-member);color:#fff;border-color:var(--c-member)':''); rNo.style.cssText='flex:1'+(joined===false?';background:var(--c-common);color:#fff;border-color:var(--c-common)':''); rbody.style.display=joined===true?'':'none'; };
    rYes.onclick=()=>{ joined=true; syncR(); }; rNo.onclick=()=>{ joined=false; syncR(); };

    const acts=el(`<div class="stack"></div>`);
    const rSave=el(`<button class="btn btn-primary big">${club?'この内容で回答する':'この内容で報告する'}</button>`);
    rSave.onclick=()=>{
      if(joined===null){ alert('「申し込みました」か「参加しない」を選んでください'); return; }
      const enteredBy=rRecBy();
      if(joined===false){ saveParticipation(eventId,childId,{status:'decline',events:[],relay:'no',attend:'no',category:null,enteredBy}); back(); return; }
      let cat=form.querySelector('#roadCat').value; if(!cat) cat=autoCategory(ev,child)||'';
      if(categoriesForEvent(ev).length && !cat){ alert('部門を選んでください'); return; }
      const attend=rAttend.querySelector('input[name=rattend]:checked')?.value||'yes';
      saveParticipation(eventId,childId,{status:'participate',events:[],relay:'no',attend,category:cat||null,enteredBy});
      back();
    };
    acts.appendChild(rSave);
    if(p && p.status==='participate'){ const c2=el(`<button class="btn btn-danger big">申込を取り消す（キャンセル）</button>`); c2.onclick=()=>{ if(confirm('申込を取り消しますか？（キャンセルとして記録します）')){ saveParticipation(eventId,childId,{status:'canceled',events:[],relay:'no',attend:'no',category:null,enteredBy:rRecBy()}); back(); } }; acts.appendChild(c2); }
    box.appendChild(acts);
    syncR();
    return box;
  }

  // ===== 駅伝：出場意思の3択（種目・出場制限なし。チーム編成はコーチ陣） =====
  if(ev.type==='ekiden'){
    const form=el(`<div class="card edge-member"></div>`); box.appendChild(form);
    form.appendChild(el(`<div class="note note-info">駅伝の<b>出場の意思</b>を回答してください。チーム編成・区間は当日コーチ陣が決めます。</div>`));
    form.appendChild(el(`<label class="f">駅伝に出場しますか？</label>`));
    const wrap=el(`<div></div>`); form.appendChild(wrap);
    EKIDEN_OPTS.forEach(([val,l])=>{ const ck=(p?p.ekidenWish:null)===val;
      wrap.appendChild(el(`<label style="display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)"><input type="radio" name="ekiden" value="${val}" ${ck?'checked':''} style="width:20px;height:20px"> <span style="font-size:16px">${esc(l)}</span></label>`)); });
    const atSec=el(`<div><label class="f">帯同（保護者の付き添い）</label><div class="at"></div></div>`);
    [['yes','できる'],['no','できない']].forEach(([v,l])=>{ const ck=(p?p.attend:'yes')===v;
      atSec.querySelector('.at').appendChild(el(`<label style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="radio" name="eattend" value="${v}" ${ck?'checked':''} style="width:20px;height:20px"> <span>${esc(l)}</span></label>`)); });
    form.appendChild(atSec);
    const rec=el(`<div style="margin-top:8px"></div>`);
    if(isProxy){ const cur=(p?p.enteredBy:Session.userId);
      rec.innerHTML=`<label class="f">記入者（代理入力の場合は変更）</label><select class="f" id="eRecBy">${DB.users.map(u=>`<option value="${u.id}" ${u.id===cur?'selected':''}>${esc(u.name)}（${ROLE[u.role].label}）</option>`).join('')}</select><div class="hint">最終更新日時は自動記録されます。</div>`;
    }else{ rec.innerHTML=`<label class="f">記入者</label><input class="f" value="${esc(Session.user().name)}" disabled><div class="hint">記入者はあなた自身になります。</div>`; }
    form.appendChild(rec);
    const eRecBy=()=> isProxy ? form.querySelector('#eRecBy').value : Session.userId;
    const acts=el(`<div class="stack"></div>`);
    const sv=el(`<button class="btn btn-primary big">この内容で回答する</button>`);
    sv.onclick=()=>{
      const w=form.querySelector('input[name=ekiden]:checked')?.value;
      if(!w){ alert('出場の意思を選んでください'); return; }
      const enteredBy=eRecBy();
      const attend=atSec.querySelector('input[name=eattend]:checked')?.value||'yes';
      if(w==='no'){ saveParticipation(eventId,childId,{status:'decline',events:[],relay:'no',attend:'no',category:null,ekidenWish:'no',enteredBy}); back(); return; }
      saveParticipation(eventId,childId,{status:'participate',events:[],relay:'no',attend,category:null,ekidenWish:w,enteredBy});
      back();
    };
    acts.appendChild(sv);
    if(p && p.status==='participate'){ const cc=el(`<button class="btn btn-danger big">出場を取り消す（キャンセル）</button>`); cc.onclick=()=>{ if(confirm('出場を取り消しますか？（キャンセルとして記録します）')){ saveParticipation(eventId,childId,{status:'canceled',events:[],relay:'no',attend:'no',category:null,ekidenWish:'no',enteredBy:eRecBy()}); back(); } }; acts.appendChild(cc); }
    box.appendChild(acts);
    return box;
  }

  const catalog=eventCatalog(ev);
  const relayRule=resolveRule(ev,'relay');
  const hasRelay = relayRule!=='リレーなし';
  const N=resolveRule(ev,'indivEvents');
  let joining = p ? (p.status==='participate') : null;

  const form=el(`<div class="card edge-member"></div>`); box.appendChild(form);
  form.appendChild(el(`<label class="f">参加しますか？</label>`));
  const toggle=el(`<div class="btn-row" style="margin-bottom:4px"></div>`);
  const bYes=el(`<button class="btn big">参加する</button>`);
  const bNo=el(`<button class="btn big">参加しない</button>`);
  toggle.appendChild(bYes); toggle.appendChild(bNo); form.appendChild(toggle);

  const body=el(`<div></div>`); form.appendChild(body);

  const evSec=el(`<div><label class="f">個人種目（${N}種目まで${relayRule==='リレーを含めて数える'?'・リレー含む':''}）</label><div class="ev"></div></div>`);
  const checksWrap=evSec.querySelector('.ev');
  catalog.forEach(name=>{
    const checked = p&&p.events&&p.events.includes(name);
    const lab=el(`<label style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="checkbox" value="${esc(name)}" ${checked?'checked':''} style="width:20px;height:20px"> <span style="font-size:16px">${esc(name)}</span></label>`);
    lab.querySelector('input').onchange=refreshWarn; checksWrap.appendChild(lab);
  });

  let relaySec=null;
  if(hasRelay){
    relaySec=el(`<div><label class="f">リレー希望</label><div class="rl"></div></div>`);
    const rw=relaySec.querySelector('.rl');
    RELAY_OPTS.forEach(([v,l])=>{
      const checked=(p?p.relay:'ifneeded')===v;
      const lab=el(`<label style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="radio" name="relay" value="${v}" ${checked?'checked':''} style="width:20px;height:20px"> <span>${esc(l)}</span></label>`);
      lab.querySelector('input').onchange=refreshWarn; rw.appendChild(lab);
    });
  }

  const attendSec=el(`<div><label class="f">帯同（保護者の付き添い）</label><div class="at"></div></div>`);
  [['yes','できる'],['no','できない']].forEach(([v,l])=>{
    const checked=(p?p.attend:'yes')===v;
    attendSec.querySelector('.at').appendChild(el(`<label style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="radio" name="attend" value="${v}" ${checked?'checked':''} style="width:20px;height:20px"> <span>${esc(l)}</span></label>`));
  });

  const warn=el(`<div></div>`);
  body.appendChild(evSec); body.appendChild(warn);
  if(relaySec) body.appendChild(relaySec);
  body.appendChild(attendSec);

  const recWrap=el(`<div style="margin-top:8px"></div>`);
  if(isProxy){
    const cur=(p?p.enteredBy:Session.userId);
    recWrap.innerHTML=`<label class="f">記入者（代理入力の場合は変更）</label>
      <select class="f" id="recBy">${DB.users.map(u=>`<option value="${u.id}" ${u.id===cur?'selected':''}>${esc(u.name)}（${ROLE[u.role].label}）</option>`).join('')}</select>
      <div class="hint">役員は代理で入力できます。最終更新日時は自動記録されます。</div>`;
  }else{
    recWrap.innerHTML=`<label class="f">記入者</label><input class="f" value="${esc(Session.user().name)}" disabled>
      <div class="hint">記入者はあなた自身になります。最終更新日時は自動記録されます。</div>`;
  }
  form.appendChild(recWrap);

  const actions=el(`<div class="stack"></div>`);
  const saveBtn=el(`<button class="btn btn-primary big">この内容で回答する</button>`);
  saveBtn.onclick=doSave; actions.appendChild(saveBtn);
  if(p && p.status==='participate'){
    const cancel=el(`<button class="btn btn-danger big">参加を取り消す（キャンセル）</button>`);
    cancel.onclick=()=>{ if(confirm('参加を取り消しますか？（キャンセルとして記録します）')){ saveParticipation(eventId,childId,{status:'canceled',events:[],relay:'no',attend:'no',enteredBy:recBy()}); back(); } };
    actions.appendChild(cancel);
  }
  box.appendChild(actions);

  function recBy(){ return isProxy ? form.querySelector('#recBy').value : Session.userId; }
  function selectedEvents(){ return [...checksWrap.querySelectorAll('input:checked')].map(i=>i.value); }
  function relayChoice(){ return hasRelay ? (relaySec.querySelector('input[name=relay]:checked')?.value||'no') : 'no'; }
  function applyState(){
    bYes.style.cssText='flex:1'+(joining===true?';background:var(--c-member);color:#fff;border-color:var(--c-member)':'');
    bNo.style.cssText='flex:1'+(joining===false?';background:var(--c-common);color:#fff;border-color:var(--c-common)':'');
    body.style.display = joining===true?'':'none';
    refreshWarn();
  }
  function refreshWarn(){
    if(joining!==true){ warn.innerHTML=''; saveBtn.disabled=false; return; }
    const r=checkLimit(ev, selectedEvents(), relayChoice());
    if(r.over){ warn.innerHTML=`<div class="note note-warn" style="margin:6px 0">🔴 出場制限を超えています。この大会は${r.relayCounts?'リレーを含めて':''}<b>${r.limit}種目まで</b>です（現在 ${r.count}）。種目またはリレー希望を調整してください。</div>`; saveBtn.disabled=true; }
    else { warn.innerHTML=''; saveBtn.disabled=false; }
  }
  function doSave(){
    if(joining===null){ alert('「参加する」か「参加しない」を選んでください'); return; }
    const enteredBy=recBy();
    if(joining===false){ saveParticipation(eventId,childId,{status:'decline',events:[],relay:'no',attend:'no',enteredBy}); back(); return; }
    const sel=selectedEvents(), rc=relayChoice();
    if(checkLimit(ev,sel,rc).over){ alert('出場制限を超えています。調整してください。'); return; }
    if(sel.length===0 && rc==='no'){ if(!confirm('種目もリレーも選ばれていません。このまま参加で回答しますか？')) return; }
    const attend=attendSec.querySelector('input[name=attend]:checked')?.value||'yes';
    saveParticipation(eventId,childId,{status:'participate',events:sel,relay:hasRelay?rc:'no',attend,enteredBy});
    back();
  }
  bYes.onclick=()=>{ joining=true; applyState(); };
  bNo.onclick=()=>{ joining=false; applyState(); };
  applyState();
  return box;
}

/* ---------- 役員：回答状況一覧（#59/#60）＋代理入力導線 ---------- */
function ResponsesScreen(){
  const ev=getEvent(route.params.eventId);
  const box=el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">役員以上のみ。</div>`)); return box; }
  if(!ev){ box.appendChild(el(`<div class="note note-warn">大会が見つかりません。</div>`)); return box; }
  const road = ev.type==='road', ekiden = ev.type==='ekiden';
  const T=terms(ev); const label=T.ans; const partLabel=T.part;
  const s=eventResponseSummary(ev);
  box.appendChild(el(`<div class="card edge-officer"><h2>📊 ${label}状況</h2>
    <p class="sub"><span class="badge b-common soft">${EVENT_TYPE[ev.type]}</span> ${esc(ev.name)}　${fmtDate(ev.date)}</p>
    <div class="btn-row">
      ${s.notanswered?`<span class="badge b-alert">🔴 未${label} ${s.notanswered}</span>`:`<span class="badge b-done">未${label} 0</span>`}
      <span class="badge b-officer">${partLabel} ${s.participate}</span>
      <span class="badge b-common soft">不参加 ${s.decline}</span>
      ${s.canceled?`<span class="badge b-warn">キャンセル ${s.canceled}</span>`:''}
      <span class="badge b-common soft">対象外 ${s.ineligible}</span>
    </div>
    <div class="hint" style="margin-top:8px">「対象外」「不参加」「未${label}」は別の状態として区別しています。行末の「代理入力」で役員が代わりに入力できます。</div></div>`));

  const order={notanswered:0,participate:1,canceled:2,decline:3,ineligible:4};
  const rows=DB.children.filter(c=>c.status==='active')
    .map(c=>({c, st:childAnswerState(ev,c), p:getParticipation(ev.id,c.id)}))
    .sort((a,b)=> order[a.st]-order[b.st] || b.c.grade-a.c.grade);

  const cols = road ? `<th>児童</th><th>状態</th><th>部門</th><th>帯同</th><th>記入者</th><th>更新</th><th></th>`
             : ekiden ? `<th>児童</th><th>状態</th><th>出場希望</th><th>帯同</th><th>記入者</th><th>更新</th><th></th>`
                    : `<th>児童</th><th>状態</th><th>種目</th><th>リレー</th><th>帯同</th><th>記入者</th><th>更新</th><th></th>`;
  const tbl=el(`<div class="card"><div class="table-scroll"><table class="t">
    <thead><tr>${cols}</tr></thead><tbody></tbody></table></div></div>`);
  const tb=tbl.querySelector('tbody');
  rows.forEach(({c,st,p})=>{
    const a=ANSWER[st];
    const isPart = p&&p.status==='participate';
    const over = (!road && isPart) ? checkLimit(ev,p.events||[],p.relay).over : false;
    const stateCell = `<span class="badge ${a.cls}">${esc(answerLabel(ev,st))}</span>${over?'<br><span class="badge b-alert" style="margin-top:3px">🔴超過</span>':''}`;
    const midCells = road
      ? `<td>${isPart?esc(p.category||'部門未選択'):'—'}</td>`
      : ekiden
      ? `<td>${isPart?esc(ekidenLabel(p.ekidenWish)):'—'}</td>`
      : `<td>${isPart?esc((p.events||[]).join('・')||'—'):'—'}</td><td>${isPart?esc(relayLabel(p.relay)):'—'}</td>`;
    const tr=el(`<tr>
      <td>${esc(nameNo(c))}<br><small style="color:var(--muted)">${c.grade}年</small></td>
      <td>${stateCell}</td>
      ${midCells}
      <td>${isPart?attendLabel(p.attend):'—'}</td>
      <td>${p?esc(userName(p.enteredBy)):'—'}</td>
      <td>${p?fmtDateTime(p.updatedAt):'—'}</td>
      <td>${st!=='ineligible'?`<button class="btn" style="padding:6px 10px;white-space:nowrap">代理入力</button>`:''}</td></tr>`);
    const btn=tr.querySelector('button'); if(btn) btn.onclick=()=>go('apply',{eventId:ev.id, childId:c.id});
    tb.appendChild(tr);
  });
  box.appendChild(tbl);
  return box;
}

/* =============================================================
   Phase 4：支払い管理
   ============================================================= */
function PaymentsScreen(){
  const ev=getEvent(route.params.eventId); const box=el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">役員以上のみ。</div>`)); return box; }
  if(!ev){ box.appendChild(el(`<div class="note note-warn">大会が見つかりません。</div>`)); return box; }
  if(!feeApplies(ev)){ box.appendChild(el(`<div class="note note-info">この大会は団での参加費徴収がないため、支払い管理はありません。</div>`)); return box; }
  const s=paymentSummary(ev);
  box.appendChild(el(`<div class="card edge-officer"><h2>💰 支払い管理</h2>
    <p class="sub">${esc(ev.name)}　（${esc(feeSummaryText(ev))}）</p>
    <div class="btn-row">
      <span class="badge b-common soft">対象 ${s.count}名</span>
      <span class="badge b-common soft">合計 ${yen(s.total)}</span>
      <span class="badge b-done">支払済 ${s.paid}名</span>
      ${s.unpaid?`<span class="badge b-alert">未払い ${s.unpaid}名（${yen(s.unpaidAmt)}）</span>`:`<span class="badge b-done">未払い 0</span>`}
      ${s.exempt?`<span class="badge b-common soft">免除 ${s.exempt}名</span>`:''}
    </div></div>`));
  const rows=paymentList(ev);
  if(!rows.length){ box.appendChild(el(`<div class="note note-info">参加者がまだいません。</div>`)); return box; }
  rows.forEach(({p,child,fee})=>{
    const cur=p.payStatus||'unpaid'; const ps=PAY_STATUS[cur];
    const card=el(`<div class="card" style="padding:12px"><div class="row" style="cursor:default">
      <div class="main"><b>${esc(nameNo(child))}</b><small>${child.grade}年 ・ ${esc(ev.type==='track'?((p.events||[]).join('・')||'種目なし'):(p.category||'部門未選択'))} ・ <b>${yen(fee)}</b></small></div>
      <span class="badge ${ps.cls}">${ps.label}</span></div></div>`);
    const brow=el(`<div class="btn-row" style="margin-top:8px"></div>`);
    [['paid','支払済'],['unpaid','未払い'],['exempt','免除']].forEach(([v,l])=>{
      const active=cur===v;
      const b=el(`<button class="btn">${l}</button>`);
      if(active) b.style.cssText='background:'+(v==='paid'?'var(--s-done)':v==='unpaid'?'var(--s-alert)':'var(--c-common)')+';color:#fff;border-color:transparent';
      b.onclick=()=>{ p.payStatus=v; p.payBy=Session.userId; p.payAt=nowJST(); save(); render(); };
      brow.appendChild(b);
    });
    card.appendChild(brow);
    if(p.payAt) card.appendChild(el(`<div class="meta"><span>支払記入：<b>${esc(userName(p.payBy))}</b></span><span>更新：<b>${fmtDateTime(p.payAt)}</b></span></div>`));
    box.appendChild(card);
  });
  return box;
}

/* =============================================================
   Phase 4：リレー編成（候補者の自動整理＋チーム編成）
   ============================================================= */
function RelayScreen(){
  const ev=getEvent(route.params.eventId); const box=el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">役員以上のみ。</div>`)); return box; }
  if(!ev){ box.appendChild(el(`<div class="note note-warn">大会が見つかりません。</div>`)); return box; }
  if(!relayOffered(ev)){ box.appendChild(el(`<div class="note note-info">この大会はリレー編成の対象ではありません。</div>`)); return box; }
  const cand=relayCandidates(ev);
  const assigned=new Set(); ev.relayTeams.forEach(t=>t.memberIds.forEach(id=>assigned.add(id)));
  box.appendChild(el(`<div class="card edge-officer"><h2>🏃 リレー編成</h2>
    <p class="sub">${esc(ev.name)}　リレー：${esc(resolveRule(ev,'relay'))}</p>
    <div class="btn-row">
      <span class="badge b-officer">🟢 優先 ${cand.priority.length}名</span>
      <span class="badge b-warn">🟡 人数不足なら可 ${cand.ifneeded.length}名</span>
    </div></div>`));

  const cList=el(`<div class="card"><h3>候補者</h3><p class="sub">回答内容から自動整理（🟢優先／🟡人数不足なら可）。</p></div>`);
  const renderCand=(arr,tag)=>{ if(!arr.length) return;
    cList.appendChild(el(`<div class="section-h" style="margin:8px 0"><h2>${tag}</h2><div class="line"></div></div>`));
    arr.forEach(({child})=>cList.appendChild(el(`<div class="row" style="cursor:default;margin-top:6px"><div class="main"><b>${esc(nameNo(child))}</b><small>${child.grade}年 ・ ${esc(child.gender)}</small></div>${assigned.has(child.id)?'<span class="badge b-common soft">編成済</span>':'<span class="badge b-warn">未割当</span>'}</div>`)));
  };
  renderCand(cand.priority,'🟢 リレー優先'); renderCand(cand.ifneeded,'🟡 人数不足なら可');
  if(!cand.priority.length && !cand.ifneeded.length) cList.appendChild(el(`<div class="note note-info">リレー希望の回答がまだありません。</div>`));
  box.appendChild(cList);

  const teamsHead=el(`<div class="card"><h3>リレーチーム</h3><p class="sub">候補者から選んで編成します（例：男子2＋女子2＋補欠など、自由に）。</p></div>`);
  const addTeam=el(`<button class="btn btn-officer">＋ チームを追加</button>`);
  addTeam.onclick=()=>{ ev.relayTeams.push({id:uid('t'), name:`チーム${ev.relayTeams.length+1}`, memberIds:[]}); ev.updatedAt=nowJST(); ev.enteredBy=Session.userId; save(); render(); };
  teamsHead.appendChild(addTeam); box.appendChild(teamsHead);

  const allCand=[...cand.priority,...cand.ifneeded];
  ev.relayTeams.forEach((team,ti)=>{
    const card=el(`<div class="card"></div>`);
    const nameRow=el(`<div style="display:flex;gap:8px;align-items:center"><input class="f" value="${esc(team.name)}" style="flex:1"><button class="btn btn-danger" style="padding:8px 12px">削除</button></div>`);
    nameRow.querySelector('input').onchange=(e)=>{ team.name=e.target.value; save(); };
    nameRow.querySelector('button').onclick=()=>{ if(confirm('このチームを削除しますか？')){ ev.relayTeams.splice(ti,1); ev.updatedAt=nowJST(); save(); render(); } };
    card.appendChild(nameRow);
    if(team.memberIds.length){ team.memberIds.forEach(id=>{ const c=getChild(id); if(!c) return;
      const mr=el(`<div class="row" style="cursor:default;margin-top:6px"><div class="main"><b>${esc(nameNo(c))}</b><small>${c.grade}年 ・ ${esc(c.gender)}</small></div><button class="btn btn-danger" style="padding:6px 10px">×</button></div>`);
      mr.querySelector('button').onclick=()=>{ team.memberIds=team.memberIds.filter(x=>x!==id); save(); render(); };
      card.appendChild(mr);
    }); } else card.appendChild(el(`<div class="hint" style="margin-top:6px">メンバー未割当</div>`));
    const avail=allCand.filter(x=>!assigned.has(x.child.id));
    if(avail.length){
      const addRow=el(`<div style="display:flex;gap:8px;margin-top:8px"><select class="f" style="flex:1">${avail.map(x=>`<option value="${x.child.id}">${esc(x.child.name)}（${x.child.grade}年${esc(x.child.gender)}・${x.p.relay==='priority'?'優先':'人数不足なら可'}）</option>`).join('')}</select><button class="btn btn-officer">追加</button></div>`);
      addRow.querySelector('button').onclick=()=>{ team.memberIds.push(addRow.querySelector('select').value); ev.updatedAt=nowJST(); save(); render(); };
      card.appendChild(addRow);
    }else card.appendChild(el(`<div class="hint" style="margin-top:8px">追加できる未割当の候補者がいません。</div>`));
    card.appendChild(el(`<div class="meta"><span>人数：<b>${team.memberIds.length}名</b></span></div>`));
    box.appendChild(card);
  });
  return box;
}

/* =============================================================
   Phase 5：記録入力（役員）
   ============================================================= */
function RecordEntryScreen(){
  const ev=getEvent(route.params.eventId); const box=el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">役員以上のみ。</div>`)); return box; }
  if(!ev){ box.appendChild(el(`<div class="note note-warn">大会が見つかりません。</div>`)); return box; }
  const rows=recordRows(ev); const prog=recordsProgress(ev);
  const isTrack=ev.type==='track';
  const head=el(`<div class="card edge-officer"><h2>📈 記録入力</h2>
    <p class="sub">${EVENT_TYPE[ev.type]}　${esc(ev.name)}　${fmtDate(ev.date)}</p>
    <div class="btn-row"><span class="badge ${prog.entered<prog.total?'b-warn':'b-done'}">入力済 ${prog.entered} / ${prog.total}</span></div>
    <div class="hint" style="margin-top:6px">${isTrack?'各種目の':'完走'}タイムは「13.92」または「2:35.21」の形式で。順位は任意。<span style="color:var(--s-alert);font-weight:700">自己ベストは赤</span>。空欄で保存すると未入力に戻ります。</div></div>`);
  const xls=el(`<div class="btn-row" style="margin-top:8px"></div>`);
  const dl=el(`<button class="btn">⬇ Excelテンプレート</button>`); dl.onclick=()=>downloadRecordTemplate(ev); xls.appendChild(dl);
  const up=el(`<label class="btn" style="cursor:pointer;display:inline-flex">⬆ Excelから取り込み<input type="file" accept=".csv,text/csv" style="display:none"></label>`);
  up.querySelector('input').onchange=(e)=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ try{ const res=importRecordsCSV(ev, decodeBytes(rd.result));
      if(!trySave()){ alert('保存容量の上限を超えました。'); return; }
      let msg=`${res.applied}件を取り込みました。`; if(res.errors.length) msg+='\n\n'+res.errors.slice(0,8).join('\n')+(res.errors.length>8?`\n…他${res.errors.length-8}件`:'');
      alert(msg); render();
    }catch(err){ alert('取り込みに失敗しました：'+(err.message||err)); } };
    rd.readAsArrayBuffer(f); };
  xls.appendChild(up);
  head.appendChild(xls);
  head.appendChild(el(`<div class="hint" style="margin-top:6px">Excel（CSV）で入力する場合：テンプレートをダウンロード → タイム・順位を記入 → 取り込み。氏名・種目の列は変更しないでください。</div>`));
  box.appendChild(head);
  if(!rows.length){ box.appendChild(el(`<div class="note note-info">記録を入力する参加者がいません。</div>`)); return box; }
  const form=el(`<div class="card"></div>`); box.appendChild(form);
  rows.forEach((row,idx)=>{
    const {child,item,cat}=row; const rec=getRecord(ev.id,child.id,item); const pb=rec&&isPB(rec);
    const sub = isTrack ? esc(item) : (cat?esc(cat):'完走タイム');
    const wrap=el(`<div style="padding:10px 0;border-bottom:1px solid var(--line)"></div>`);
    wrap.appendChild(el(`<div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1"><b>${esc(nameNo(child))}</b> <small style="color:var(--muted)">${child.grade}年 ・ ${sub}</small></div>
      ${pb?'<span style="color:var(--s-alert);font-weight:700">⭐ 自己ベスト</span>':''}</div>`));
    const line=el(`<div style="display:flex;gap:8px;margin-top:6px;align-items:center"></div>`);
    line.appendChild(el(`<input class="f" id="rec_time_${idx}" value="${esc(rec?rec.mark:'')}" placeholder="タイム（例 2:35.21）" style="flex:2${pb?';color:var(--s-alert);font-weight:700':''}">`));
    line.appendChild(el(`<input class="f" id="rec_rank_${idx}" type="number" min="1" value="${rec&&rec.rank!=null?rec.rank:''}" placeholder="順位" style="flex:1">`));
    line.appendChild(el(`<span style="color:var(--muted)">位</span>`));
    wrap.appendChild(line);
    form.appendChild(wrap);
  });
  const saveBtn=el(`<button class="btn btn-officer big">保存する</button>`);
  saveBtn.onclick=()=>{
    let bad=false;
    rows.forEach((row,idx)=>{
      const {child,item}=row;
      const mark=form.querySelector('#rec_time_'+idx).value.trim();
      const rankRaw=form.querySelector('#rec_rank_'+idx).value.trim();
      const rank=rankRaw===''?null:Number(rankRaw);
      const existing=getRecord(ev.id,child.id,item);
      if(mark || rank!=null){
        if(mark && parseMark(mark)==null){ if(!confirm(`${child.name}のタイム「${mark}」は数値として読めません。このまま保存しますか？`)){ bad=true; return; } }
        if(existing){ existing.mark=mark; existing.rank=rank; existing.grade=child.grade; existing.enteredBy=Session.userId; existing.updatedAt=nowJST(); }
        else DB.records.push({ id:uid('r'), childId:child.id, item, mark, rank, date:ev.date, eventName:ev.name, eventId:ev.id, grade:child.grade, enteredBy:Session.userId, updatedAt:nowJST() });
      }else if(existing){ DB.records=DB.records.filter(r=>r!==existing); }
    });
    save(); alert('保存しました'+(bad?'（一部スキップした項目があります）':'')); render();
  };
  box.appendChild(saveBtn);
  const lineBtn=el(`<button class="btn big">✉️ 「記録入力しました」のLINE文面へ</button>`);
  lineBtn.onclick=()=>go('lineText',{eventId:ev.id});
  box.appendChild(lineBtn);
  return box;
}

/* =============================================================
   Phase 5：記録・自己ベスト閲覧（会員＝自分の子／役員＝全員）
   ============================================================= */
function bestRecord(childId,item){ const recs=childItemRecords(childId,item).filter(r=>parseMark(r.mark)!=null); if(!recs.length) return null; return recs.reduce((a,b)=>parseMark(b.mark)<parseMark(a.mark)?b:a); }
function bestMark(childId,item){ const r=bestRecord(childId,item); return r?r.mark:null; }
function fmtDateShort(d){ if(!d) return ''; const [y,m,da]=d.split('-'); return `${y}/${Number(m)}/${Number(da)}`; }

    tb.appendChild(el(`<tr><td class="name">${esc(nameNo(c))}（${c.grade}年）</td>${cells}</tr>`));
  });
  wrap.appendChild(table); area.appendChild(wrap);
  box.appendChild(area);

      });
    });
    box.appendChild(card);
  });

/* =============================================================
   管理者：古い資料（写真・PDF）の整理
   ============================================================= */
function DocsCleanupScreen(){
  const box=el('<div class="stack"></div>');
  if(!Session.can('admin')){ box.appendChild(el(`<div class="note note-warn">この操作は管理者のみ可能です。</div>`)); return box; }
  const nowY = DB.year || 0;
  const years = Number(route.params.years||5);
  const cutoff = nowY - years; // この年（含む）以前が削除対象

  box.appendChild(el(`<div class="card edge-admin"><h2>🧹 古い資料の整理</h2>
    <p class="sub">古い年度の<b>写真・PDF</b>だけを削除して容量を空けます。大会・記録・回答は消しません。</p>
    <label class="f">削除する範囲</label>
    <select class="f" id="cl_years">
      ${[3,5,10].map(y=>`<option value="${y}" ${y===years?'selected':''}>${y}年以上前（${nowY-y}年以前）</option>`).join('')}
    </select></div>`));
  box.querySelector('#cl_years').onchange=(e)=>go('docsCleanup',{years:Number(e.target.value)});

  // 全添付の現状
  const allDocs = DB.events.flatMap(e=>(e.docs||[]).map(d=>({e,d})));
  const totalBytes = allDocs.reduce((s,x)=>s+docBytes(x.d),0);
  // 削除対象（cutoff年以前で添付ありの大会）
  const olds = DB.events.filter(e=> eventYear(e)<=cutoff && (e.docs&&e.docs.length))
    .map(e=>({ e, count:e.docs.length, bytes:e.docs.reduce((s,d)=>s+docBytes(d),0) }))
    .sort((a,b)=> eventYear(a.e)-eventYear(b.e));
  const delCount = olds.reduce((s,x)=>s+x.count,0);
  const delBytes = olds.reduce((s,x)=>s+x.bytes,0);

  box.appendChild(el(`<div class="card">
    <div class="row" style="cursor:default"><div class="main"><small>現在の全添付</small><b>${allDocs.length}件 ・ ${fmtSize(totalBytes)}</b></div></div>
    <div class="row" style="cursor:default;margin-top:8px"><div class="main"><small>削除対象（${nowY-years}年以前）</small><b class="tag-alert">${delCount}件 ・ ${fmtSize(delBytes)}</b></div></div>
  </div>`));

  if(!olds.length){
    box.appendChild(el(`<div class="note note-info">${nowY-years}年以前で、削除できる写真・PDFはありません。</div>`));
    return box;
  }

  olds.forEach(({e,count,bytes})=>{
    box.appendChild(el(`<div class="row" style="cursor:default"><div class="main"><b>${esc(e.name)}</b><small>${eventYear(e)}年 ・ ${count}件 ・ ${fmtSize(bytes)}</small></div></div>`));
  });

  const del=el(`<button class="btn btn-danger big" style="margin-top:8px">🗑 ${nowY-years}年以前の写真・PDFを削除（${delCount}件）</button>`);
  del.onclick=()=>{
    if(!confirm(`${nowY-years}年以前の大会の写真・PDF ${delCount}件（${fmtSize(delBytes)}）を削除します。大会・記録・回答は残ります。よろしいですか？`)) return;
    olds.forEach(({e})=>{ e.docs=[]; e.updatedAt=nowJST(); e.enteredBy=Session.userId; });
    save(); alert(`削除しました（${fmtSize(delBytes)}を解放）。`); render();
  };
  box.appendChild(del);
  box.appendChild(el(`<div class="note note-info" style="font-size:12px">試作版では、この端末に保存された添付を削除します。本番では実際のファイル保管容量が解放されます。</div>`));
  return box;
}

/* =============================================================
   Phase 6：クラブ情報（ルール/安全/知恵袋/トレーニング/規約）＋検索
   ============================================================= */
const SECTIONS = {
  rules:    { label:'陸上ルール', icon:'📚', cats:['短距離','中長距離','スタート/フィニッシュ','リレー・バトン','招集・その他'], kinds:[['official','公式(JAAF等)'],['club','クラブ独自']] },
  safety:   { label:'安全・安心', icon:'🛡️', cats:['けが予防','準備運動・柔軟','熱中症・暑さ対策','水分・体調','雨天・悪天候','大会時の安全'], kinds:[['official','公的機関の情報'],['club','クラブ独自']] },
  knowledge:{ label:'クラブの知恵袋', icon:'💡', cats:['監督からのアドバイス','暑い日の対策','雨の日対策','食事','大会','持ち物','会場','練習','保護者の工夫','その他'], kinds:[['coach','監督から'],['guardian','保護者から']] },
  training: { label:'トレーニング図鑑', icon:'🏃', cats:['短距離','中長距離','基礎・体づくり','家でできる','雨の日','暑い日'], kinds:[] },
  docs:     { label:'クラブ規約', icon:'📜', cats:['規約','その他'], kinds:[] },
};
function kindBadge(kind){
  const map={ official:{l:'公式',c:'b-member'}, club:{l:'クラブ独自',c:'b-officer'}, coach:{l:'監督から',c:'b-admin'}, guardian:{l:'保護者から',c:'b-member'} };
  const k=map[kind]; return k?`<span class="badge ${k.c}">${k.l}</span>`:'';
}
const getContent = id => DB.content.find(c=>c.id===id);
function contentAll(){ let l=DB.content.slice(); if(!Session.can('officer')) l=l.filter(c=>c.status==='published'); return l; }
function contentList(section){ return contentAll().filter(c=>c.section===section).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')); }

function ContentListScreen(){
  const section=route.params.section, S=SECTIONS[section]; const box=el('<div class="stack"></div>');
  if(!S){ box.appendChild(el(`<div class="note note-warn">セクションが見つかりません。</div>`)); return box; }
  const canEdit=Session.can('officer');
  const head=el(`<div class="card ${canEdit?'edge-officer':''}"><h2>${S.icon} ${S.label}</h2><p class="sub">${canEdit?'公開・下書きを管理できます。':'クラブの情報です。'}</p></div>`);
  if(canEdit){ const add=el(`<button class="btn btn-officer">＋ 新規作成</button>`); add.onclick=()=>go('contentEdit',{section,id:null}); head.appendChild(add); }
  box.appendChild(head);
  const cat=route.params.cat||'';
  const chips=el(`<div class="btn-row" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px"></div>`);
  const mkChip=(val,label)=>{ const b=el(`<button class="btn" style="white-space:nowrap;${cat===val?'background:var(--c-common);color:#fff;border-color:var(--c-common)':''}">${esc(label)}</button>`); b.onclick=()=>go('content',{section,cat:val}); chips.appendChild(b); };
  mkChip('','すべて'); S.cats.forEach(c=>mkChip(c,c)); box.appendChild(chips);
  let list=contentList(section); if(cat) list=list.filter(c=>c.category===cat);
  if(!list.length){ box.appendChild(el(`<div class="note note-info">まだ登録がありません。${canEdit?'「＋新規作成」から追加できます。':''}</div>`)); return box; }
  list.forEach(c=>{ const r=el(`<div class="row"><div class="main"><b>${esc(c.title)}</b><small>${esc(c.category||'')}${c.status!=='published'?' ・ 下書き':''}</small></div>${kindBadge(c.kind)}<span class="chev">›</span></div>`); r.onclick=()=>go('contentDetail',{id:c.id}); box.appendChild(r); });
  return box;
}

function ContentDetailScreen(){
  const c=getContent(route.params.id); const box=el('<div class="stack"></div>');
  if(!c){ box.appendChild(el(`<div class="note note-warn">見つかりません。</div>`)); return box; }
  if(c.status!=='published' && !Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">この内容は下書きです。</div>`)); return box; }
  const S=SECTIONS[c.section]||{icon:'',label:''};
  const card=el(`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="flex:1;min-width:0">${esc(c.title)}</h2>${kindBadge(c.kind)}</div>
    <p class="sub">${S.icon} ${esc(S.label)}${c.category?' ・ '+esc(c.category):''}${c.status!=='published'?' ・ <span class="tag-warn">下書き</span>':''}</p></div>`);
  card.appendChild(el(`<div style="white-space:pre-wrap;line-height:1.8">${esc(c.body||'')}</div>`));
  box.appendChild(card);
  if(c.images&&c.images.length){ const g=el(`<div class="card"><h3>画像</h3><div style="display:flex;flex-wrap:wrap;gap:10px"></div></div>`); const gg=g.querySelector('div:last-child'); c.images.forEach(src=>gg.appendChild(el(`<a href="${src}" target="_blank" rel="noopener"><img src="${src}" style="width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`))); box.appendChild(g); }
  if(c.docs&&c.docs.length){ const g=el(`<div class="card"><h3>資料</h3></div>`); c.docs.forEach(d=>g.appendChild(el(`<a class="btn" href="${d.dataUrl}" target="_blank" rel="noopener" style="margin-top:6px;display:inline-flex">📄 ${esc(d.name)}</a>`))); box.appendChild(g); }
  if(c.source||c.checkedDate){ box.appendChild(el(`<div class="note note-info">${c.source?`出典：${esc(c.source)}`:''}${(c.source&&c.checkedDate)?'　':''}${c.checkedDate?`確認日：${fmtDate(c.checkedDate)}`:''}</div>`)); }
  box.appendChild(el(`<div class="meta"><span>記入者：<b>${esc(userName(c.enteredBy))}</b></span><span>最終更新：<b>${fmtDateTime(c.updatedAt)}</b></span></div>`));
  if(Session.can('officer')){ const e=el(`<button class="btn btn-officer big">✏️ 編集</button>`); e.onclick=()=>go('contentEdit',{section:c.section,id:c.id}); box.appendChild(e); }
  return box;
}

function ContentEditScreen(){
  const section=route.params.section, S=SECTIONS[section]; const box=el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">役員以上のみ。</div>`)); return box; }
  if(!S){ box.appendChild(el(`<div class="note note-warn">セクション不明。</div>`)); return box; }
  const editing=!!route.params.id;
  const c=editing?getContent(route.params.id):{ section, category:S.cats[0], kind:(S.kinds[0]?S.kinds[0][0]:null), title:'', body:'', source:'', checkedDate:'', images:[], docs:[], status:'published' };
  const officialish = section==='rules'||section==='safety';
  const form=el(`<div class="card edge-officer">
    <h2>${editing?'✏️ 編集':'＋ 新規作成'}（${esc(S.label)}）</h2>
    <label class="f">タイトル</label><input class="f" id="c_title" value="${esc(c.title)}">
    <label class="f">カテゴリー</label><select class="f" id="c_cat">${S.cats.map(x=>`<option ${c.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    ${S.kinds.length?`<label class="f">区分</label><select class="f" id="c_kind">${S.kinds.map(([v,l])=>`<option value="${v}" ${c.kind===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
    <label class="f">内容</label><textarea class="f" id="c_body" style="min-height:150px">${esc(c.body)}</textarea>
    ${officialish?`<label class="f">出典（公的機関・規則など）</label><input class="f" id="c_source" value="${esc(c.source||'')}" placeholder="例）日本陸上競技連盟 競技規則">
    <label class="f">確認日</label><input class="f" id="c_checked" type="date" value="${esc(c.checkedDate||'')}">
    <div class="hint">公式情報は出典・確認日を残し、クラブ独自情報と区別します。</div>`:''}
    <label class="f">公開状態</label><select class="f" id="c_status"><option value="published" ${c.status==='published'?'selected':''}>公開</option><option value="draft" ${c.status==='draft'?'selected':''}>下書き</option></select>
    <div id="c_imgs"></div>
  </div>`);
  box.appendChild(form);
  let imgs=[...(c.images||[])]; const imgWrap=form.querySelector('#c_imgs');
  function renderImgs(){ imgWrap.innerHTML=`<label class="f">画像（任意）</label>`;
    const pick=el(`<label class="btn" style="cursor:pointer;display:inline-flex">📷 画像を追加<input type="file" accept="image/*" multiple style="display:none"></label>`);
    pick.querySelector('input').onchange=async(ev)=>{ const files=[...ev.target.files]; ev.target.value=''; for(const f of files){ try{ imgs.push(await fileToImageDataUrl(f)); }catch(e){} } renderImgs(); };
    imgWrap.appendChild(pick);
    if(imgs.length){ const g=el(`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>`); imgs.forEach((src,i)=>{ const cell=el(`<div style="width:90px"></div>`); cell.appendChild(el(`<img src="${src}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`)); const del=el(`<button class="btn btn-danger" style="width:100%;padding:3px;font-size:11px;margin-top:3px">削除</button>`); del.onclick=()=>{ imgs.splice(i,1); renderImgs(); }; cell.appendChild(del); g.appendChild(cell); }); imgWrap.appendChild(g); }
  }
  renderImgs();
  const save1=el(`<button class="btn btn-officer big">保存する</button>`);
  save1.onclick=()=>{
    const title=$('#c_title').value.trim(); if(!title){ alert('タイトルを入力してください'); return; }
    const data={ section, category:$('#c_cat').value, kind:S.kinds.length?$('#c_kind').value:null, title, body:$('#c_body').value, source:officialish?$('#c_source').value.trim():'', checkedDate:officialish?$('#c_checked').value:'', images:imgs, docs:c.docs||[], status:$('#c_status').value, enteredBy:Session.userId, updatedAt:nowJST() };
    if(editing){ const cur=getContent(c.id); const bak=JSON.stringify(cur); Object.assign(cur,data); if(!trySave()){ Object.assign(cur,JSON.parse(bak)); alert('保存容量の上限を超えました。画像を減らしてください。'); return; } }
    else { const nc={id:uid('ct'),...data}; DB.content.push(nc); if(!trySave()){ DB.content.pop(); alert('保存容量の上限を超えました。画像を減らしてください。'); return; } }
    back();
  };
  box.appendChild(save1);
  if(editing){ const del=el(`<button class="btn btn-danger big">削除</button>`); del.onclick=()=>{ if(confirm('この項目を削除しますか？')){ DB.content=DB.content.filter(x=>x.id!==c.id); save(); back(); } }; box.appendChild(del); }
  return box;
}

/* 横断検索（大会・会場・クラブ情報） */
function SearchScreen(){
  const box=el('<div class="stack"></div>'); const q=(route.params.q||'').trim();
  const bar=el(`<div class="card"><h2>🔍 検索</h2><input class="f" id="sq" placeholder="大会・会場・ルール・トレーニング・知恵袋…" value="${esc(q)}"><div class="hint" style="margin-top:6px">キーワードを入れて Enter</div></div>`);
  box.appendChild(bar);
  const inp=bar.querySelector('#sq'); inp.onkeydown=(e)=>{ if(e.key==='Enter') go('search',{q:inp.value}); };
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} },0);
  if(!q) return box;
  const ql=q.toLowerCase(); const hit=s=>String(s||'').toLowerCase().includes(ql);
  const results=[];
  DB.events.forEach(e=>{ if(hit(e.name)||hit(e.note)||hit(e.outline)) results.push({t:`${e.type==='road'?'🛣️':e.type==='ekiden'?'🎽':'🏟️'} ${e.name}`,s:`${EVENT_TYPE[e.type]} ・ ${fmtDate(e.date)}`,r:['eventDetail',{id:e.id}]}); });
  DB.venues.forEach(v=>{ if(hit(v.name)||hit(v.address)||hit(v.note)) results.push({t:`🗺️ ${v.name}`,s:v.address||'',r:['venueDetail',{id:v.id}]}); });
  contentAll().forEach(c=>{ if(hit(c.title)||hit(c.body)||hit(c.category)){ const S=SECTIONS[c.section]; results.push({t:`${S.icon} ${c.title}`,s:`${S.label}${c.category?' ・ '+c.category:''}`,r:['contentDetail',{id:c.id}]}); } });
  if(!results.length){ box.appendChild(el(`<div class="note note-info">「${esc(q)}」に一致する情報は見つかりませんでした。</div>`)); return box; }
  box.appendChild(el(`<div class="hint" style="margin:4px 2px">${results.length}件</div>`));
  results.forEach(x=>{ const row=el(`<div class="row"><div class="main"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div><span class="chev">›</span></div>`); row.onclick=()=>go(x.r[0],x.r[1]); box.appendChild(row); });
  return box;
}

/* =============================================================
   Phase 7：年度更新（学年繰り上げ・卒団／過去データは保持）
   ============================================================= */
function downloadBackup(){ downloadFile(`clubhouse_backup_${DB.year}.json`, JSON.stringify(DB), 'application/json'); }

function YearUpdateScreen(){
  const box=el('<div class="stack"></div>');
  if(!Session.can('admin')){ box.appendChild(el(`<div class="note note-warn">年度更新は管理者のみ可能です。</div>`)); return box; }
  const nowY=DB.year, nextY=DB.year+1;
  box.appendChild(el(`<div class="card edge-admin"><h2>🔄 年度更新</h2>
    <p class="sub"><b>${nowY}年度 → ${nextY}年度</b> に更新します。全員の学年が1つ上がり、6年生は卒団になります。</p></div>`));

  // 引き継ぎ・保持の説明
  box.appendChild(el(`<div class="note note-info">
    <b>そのまま引き継ぐ（消えません）：</b>過去の記録・自己ベスト、過去の大会、会場情報、陸上ルール／安全／知恵袋／トレーニング図鑑、規約、デフォルト設定、保護者情報。<br>
    <b>更新する：</b>児童の学年（＋1）、6年生→卒団。</div>`));

  // バックアップ（安全策）
  const backup=el(`<div class="card"><h3>💾 実行前のバックアップ（推奨）</h3>
    <p class="sub">万一に備え、今のデータをファイルに書き出せます。あとで「復元」で元に戻せます。</p></div>`);
  const bk=el(`<button class="btn btn-officer">💾 バックアップを書き出し（JSON）</button>`); bk.onclick=downloadBackup; backup.appendChild(bk);
  const rs=el(`<label class="btn" style="cursor:pointer;display:inline-flex;margin-top:8px">↩ バックアップから復元<input type="file" accept="application/json,.json" style="display:none"></label>`);
  rs.querySelector('input').onchange=(ev)=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
    if(!confirm('現在のデータを、選んだバックアップで上書きします。よろしいですか？')) return;
    const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.children)) throw new Error('形式が違います'); DB=migrate(d); if(!trySave()){ alert('保存容量を超えました。'); return; } route={name:'home',params:{}}; render(); alert('復元しました。'); }catch(e){ alert('復元に失敗しました：'+(e.message||e)); } }; r.readAsText(f); };
  backup.appendChild(rs);
  const rst=el(`<button class="btn btn-danger" style="margin-top:8px;display:block">🧪 サンプルデータに初期化（お試し用）</button>`);
  rst.onclick=()=>{ if(confirm('この端末のデータをすべて消して、最初のサンプルデータに戻します。（お試し用）よろしいですか？')){ resetDB(); Session.previewRole=null; route={name:'home',params:{}}; render(); alert('サンプルデータに初期化しました。'); } };
  backup.appendChild(rst);
  box.appendChild(backup);

  // プレビュー
  const targets=DB.children.filter(c=>c.status==='active'||c.status==='pause');
  const grads=targets.filter(c=>c.grade>=6);
  const ups=targets.filter(c=>c.grade<6);
  box.appendChild(el(`<div class="card"><h3>変更の内容</h3>
    <div class="btn-row"><span class="badge b-officer">学年繰り上げ ${ups.length}名</span><span class="badge b-warn">卒団 ${grads.length}名</span></div></div>`));
  const prev=el(`<div class="card"><div class="table-scroll"><table class="t"><thead><tr><th>児童</th><th>現在</th><th></th><th>更新後</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=prev.querySelector('tbody');
  targets.slice().sort((a,b)=>b.grade-a.grade).forEach(c=>{
    const after = c.grade>=6 ? '<span class="tag-warn">卒団</span>' : `${c.grade+1}年`;
    tb.appendChild(el(`<tr><td>${esc(nameNo(c))}</td><td>${c.grade}年</td><td>→</td><td>${after}</td></tr>`));
  });
  if(targets.length) box.appendChild(prev);
  else box.appendChild(el(`<div class="note note-info">対象の児童がいません。</div>`));

  // 実行
  const run=el(`<button class="btn btn-admin big">🔄 ${nowY}年度 → ${nextY}年度 に更新する</button>`);
  run.onclick=()=>{
    if(!confirm(`【確認1/2】${nowY}年度→${nextY}年度に更新します。\n・学年繰り上げ ${ups.length}名\n・卒団 ${grads.length}名\n過去の記録・大会などは消えません。よろしいですか？`)) return;
    if(!confirm(`【確認2/2】この操作は元に戻せません（バックアップからの復元は可能）。実行しますか？`)) return;
    let up=0, gr=0;
    targets.forEach(c=>{ if(c.grade>=6){ c.status='grad'; c.gradYear=nowY; gr++; } else { c.grade+=1; up++; } c.enteredBy=Session.userId; c.updatedAt=nowJST(); });
    DB.year=nextY;
    DB.yearHistory.push({ year:nextY, promoted:up, graduated:gr, updatedAt:nowJST(), by:Session.userId });
    save();
    alert(`${nextY}年度に更新しました。（繰り上げ ${up}名／卒団 ${gr}名）`);
    route={name:'home',params:{}}; render();
  };
  box.appendChild(run);

  // 補足導線
  box.appendChild(el(`<div class="note note-info" style="font-size:13px">
    ・新入会員の登録：ホーム＞会員名簿＞「＋児童を登録」<br>
    ・役員交代：管理者メニュー＞権限管理<br>
    ・新年度の大会：大会ページの「複製して新規作成」で昨年の設定を使い回せます</div>`));
  if(DB.yearHistory.length){
    const h=el(`<div class="card"><h3>年度更新の履歴</h3></div>`);
    DB.yearHistory.slice().reverse().forEach(x=>h.appendChild(el(`<div class="row" style="cursor:default;margin-top:6px"><div class="main"><b>${x.year}年度へ更新</b><small>繰り上げ${x.promoted}名・卒団${x.graduated}名 ／ ${fmtDateTime(x.updatedAt)} ／ ${esc(userName(x.by))}</small></div></div>`)));
    box.appendChild(h);
  }
  return box;
}

function SoonScreen(){
  const f = route.params.feature || 'この機能';
  const box = el('<div class="stack"></div>');
