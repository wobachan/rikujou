<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>陸上クラブ レッツ！アプリ（試作版）</title>
<style>
  /* =========================================================
     デザインシステム
     権限色: 黒=共通 / 青=一般会員 / 緑=役員 / 紫=管理者
     状態色: 赤=要対応 / 橙=期限・確認 / 緑=完了
     ※色だけに頼らず、必ず文字・アイコンを併記する
     ========================================================= */
  :root{
    --c-common:#334155;   /* 黒（共通） */
    --c-member:#2563eb;   /* 青（一般会員） */
    --c-officer:#16a34a;  /* 緑（役員） */
    --c-admin:#7c3aed;    /* 紫（管理者） */
    --s-alert:#dc2626;    /* 赤（要対応） */
    --s-warn:#ea580c;     /* 橙（期限・確認） */
    --s-done:#16a34a;     /* 緑（完了） */

    --bg:#f1f5f9;
    --card:#ffffff;
    --line:#e2e8f0;
    --text:#0f172a;
    --muted:#64748b;
    --radius:14px;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--text);
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;}

  /* ---- アプリバー ---- */
  .appbar{
    position:sticky; top:0; z-index:50;
    background:var(--c-common); color:#fff;
    padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px;
  }
  .appbar .title{font-weight:700; font-size:16px; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appbar .back{background:rgba(255,255,255,.15); border:0; color:#fff;
    width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer;}
  .appbar .back:disabled{opacity:.35; cursor:default;}

  /* ---- レイアウト ---- */
  .wrap{max-width:820px; margin:0 auto; padding:16px 14px 90px;}
  .stack{display:flex; flex-direction:column; gap:12px;}

  /* ---- 現在ユーザー帯 ---- */
  .userbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px; box-shadow:var(--shadow);
  }
  .userbar .who{flex:1; min-width:120px;}
  .userbar .who b{font-size:15px;}
  .userbar .who small{color:var(--muted); display:block;}

  /* ---- バッジ ---- */
  .badge{display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px;
    color:#fff; white-space:nowrap;}
  .b-common{background:var(--c-common);}
  .b-member{background:var(--c-member);}
  .b-officer{background:var(--c-officer);}
  .b-admin{background:var(--c-admin);}
  .b-alert{background:var(--s-alert);}
  .b-warn{background:var(--s-warn);}
  .b-done{background:var(--s-done);}
  .badge.soft{color:var(--text); background:#fff;
    border:1px solid currentColor;}
  .tag-alert{color:var(--s-alert);} .tag-warn{color:var(--s-warn);}
  .tag-done{color:var(--s-done);} .tag-officer{color:var(--c-officer);}
  .tag-admin{color:var(--c-admin);}

  /* ---- カード ---- */
  .card{background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .card h2{margin:0 0 4px; font-size:16px;}
  .card h3{margin:0 0 6px; font-size:15px;}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 10px;}
  .card.edge-member{border-left:5px solid var(--c-member);}
  .card.edge-officer{border-left:5px solid var(--c-officer);}
  .card.edge-admin{border-left:5px solid var(--c-admin);}

  /* ---- メニュー大ボタン ---- */
  .menu-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .menu-btn{
    display:flex; flex-direction:column; gap:2px; text-align:left;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; cursor:pointer;
    box-shadow:var(--shadow); min-height:72px; color:var(--text);
  }
  .menu-btn:active{transform:scale(.99);}
  .menu-btn .ico{font-size:24px;}
  .menu-btn .lbl{font-weight:700; font-size:15px;}
  .menu-btn .desc{font-size:12px; color:var(--muted);}
  .menu-btn.soon{opacity:.75;}
  .menu-btn.wide{grid-column:1 / -1;}

  /* ---- 汎用ボタン ---- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line); background:#fff; color:var(--text);
    border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600;
    cursor:pointer;}
  .btn.big{padding:16px; font-size:16px; width:100%;}
  .btn-primary{background:var(--c-member); border-color:var(--c-member); color:#fff;}
  .btn-officer{background:var(--c-officer); border-color:var(--c-officer); color:#fff;}
  .btn-admin{background:var(--c-admin); border-color:var(--c-admin); color:#fff;}
  .btn-danger{background:#fff; border-color:var(--s-alert); color:var(--s-alert);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--muted);}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---- リスト行 ---- */
  .row{display:flex; align-items:center; gap:10px; padding:12px;
    border:1px solid var(--line); border-radius:12px; background:#fff; cursor:pointer;}
  .row:active{background:#f8fafc;}
  .row .main{flex:1; min-width:0;}
  .row .main b{font-size:15px;}
  .row .main small{color:var(--muted); display:block;}
  .row .chev{color:var(--muted); font-size:18px;}

  /* ---- メタ情報（記入者・最終更新） ---- */
  .meta{font-size:12px; color:var(--muted); margin-top:8px;
    display:flex; gap:12px; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:8px;}
  .meta b{color:var(--text); font-weight:600;}

  /* ---- フォーム ---- */
  label.f{display:block; margin:10px 0 4px; font-size:13px; font-weight:600;}
  input.f, select.f, textarea.f{
    width:100%; padding:11px; border:1px solid var(--line); border-radius:10px;
    font-size:16px; background:#fff; color:var(--text);}
  textarea.f{min-height:70px; resize:vertical;}
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}

  /* ---- テーブル（役員向け・広い画面） ---- */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.t{width:100%; border-collapse:collapse; font-size:13px; min-width:520px;}
  table.t th,table.t td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  table.t th{background:#f8fafc; color:var(--muted); font-weight:600;}

  /* ---- 注意ボックス ---- */
  .note{border-radius:12px; padding:11px 13px; font-size:13px; border:1px solid;}
  .note-info{background:#eff6ff; border-color:#bfdbfe; color:#1e3a8a;}
  .note-warn{background:#fff7ed; border-color:#fed7aa; color:#9a3412;}
  .note-proto{background:#faf5ff; border-color:#e9d5ff; color:#6b21a8;}

  .section-h{display:flex; align-items:center; gap:8px; margin:6px 2px;}
  .section-h h2{margin:0; font-size:15px; color:var(--muted); font-weight:700;}
  .section-h .line{flex:1; height:1px; background:var(--line);}

  /* ---- ログイン ---- */
  .login-wrap{max-width:440px; margin:0 auto; padding:24px 16px;}
  .login-hero{text-align:center; margin:16px 0 22px;}
  .login-hero .logo{font-size:52px;}
  .login-hero h1{font-size:22px; margin:6px 0 2px;}
  .login-hero p{color:var(--muted); margin:0; font-size:14px;}
  .acct{display:flex; align-items:center; gap:12px; padding:14px;
    border:1px solid var(--line); border-radius:12px; background:#fff;
    cursor:pointer; box-shadow:var(--shadow); margin-bottom:10px;}
  .acct .av{width:42px; height:42px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:17px;}
  .acct .info{flex:1;}
  .acct .info b{font-size:15px;} .acct .info small{display:block; color:var(--muted);}

  @media(min-width:560px){ .menu-grid{grid-template-columns:repeat(3,1fr);} }

  /* ---- A4 自己ベスト一覧（印刷用） ---- */
  .a4wrap{overflow-x:auto;}
  table.a4{width:100%; border-collapse:collapse; background:#fff;}
  table.a4 th, table.a4 td{border:1px solid #333; padding:6px 8px; text-align:center; vertical-align:middle;}
  table.a4 th{background:#eee; font-size:13px;}
  table.a4 td .t{font-weight:700; font-size:16px;}
  table.a4 td .m{font-size:11px; color:#555;}
  table.a4 td.name{text-align:left; white-space:nowrap;}
  @media print{
    .appbar, .userbar, .no-print{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0 !important; max-width:none !important;}
    .card{box-shadow:none !important; border:none !important; padding:0 !important;}
    #a4print{display:block !important;}
    table.a4{font-size:11px;} table.a4 td .t{font-size:14px;}
    @page{size:A4 landscape; margin:10mm;}
  }
</style>
</head>

  const d = new Date();
  const j = new Date(d.getTime() + (9*60 + d.getTimezoneOffset())*60000);
  const p = n => String(n).padStart(2,'0');
  return `${j.getFullYear()}-${p(j.getMonth()+1)}-${p(j.getDate())}T${p(j.getHours())}:${p(j.getMinutes())}`;
}

  if(!iso) return '—';

      { id:'ct_home2', section:'training', category:'家でできる', kind:null, title:'② ゴロゴロしながらタオルバランス',
        body:'【やり方】\n1) 仰向けになり、片足のつま先にタオルをかける\n2) タオルを落とさないように体を横に倒し、うつ伏せへ寝返る（うつ伏せでも足は天井方向に保つ）\n3) タオルを落とさないように股関節を使い、仰向けにもどる\n・タオルを落とさず5〜10回連続、左右交互に2〜3セット\n\nポイント：タオルをかけた足をできるだけ高く上げた状態で行うと効果が高まる。\n効果：体幹を安定させる／股関節の柔軟性を高める。\n目的：姿勢の安定とバランス、股関節の操作性を高め、ブレずに安定感のある走行フォームを身につける。',

        body:'【やり方】\n1) お腹を上に向けて、お尻を高い位置でキープする\n2) その状態を保ちながら、手と足を使って前方（頭頂部方向）に移動していく\n・部屋の中を30〜60秒テクテク、2〜3回\n\nポイント：お尻をしっかり高く上げる／周りに気を付ける。\n効果：体幹を安定化し、股関節の伸展可動域を広げる。\n目的：蹴り出しをスムーズにし、スピードを上げて走る際の動きをスムーズにできるようにする。',

const STORAGE_KEY = 'rikujo_clubhouse_v1';
let DB = load();
function load(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){ const d=JSON.parse(s);
      // 作成日時(APP_VERSION)が同じ＝そのまま。違う＝新しい版なので最新データに自動更新
      if(d && d.__ver===APP_VERSION) return migrate(d);
    }
  }catch(e){}
  const fresh=applyTrialState(migrate(seedDB())); fresh.__ver=APP_VERSION; return fresh;
}
// お試し用：締切の補完＋過去大会を「終了・提出済み・実際に近い参加状況」にしておく
function applyTrialState(db){
  const CUT = '2026-08-01'; // この日より前の開催日は終了扱い（お試し用）
  const staff = (db.users||[]).find(u=>/事務局/.test(u.staffRole||''))
             || (db.users||[]).find(u=>u.role==='admin')
             || (db.users||[]).find(u=>u.role==='officer');
  const by = staff ? staff.id : ((db.users||[])[0]||{}).id;
  const venName = id => { const v=(db.venues||[]).find(x=>x.id===id); return v?v.name:''; };
  // 登録番号（3桁）を付与。すでに番号のある子はそのまま。入団したての1人だけ未付与のまま残す。
  const REG=['112','128','203','215','247','266','319','334','356','372','405','421','448','467','483','506','529','541','577','594'];
  const active=(db.children||[]).filter(c=>c.status==='active').slice()
    .sort((a,b)=>(a.joinYear||0)-(b.joinYear||0) || String(a.id).localeCompare(String(b.id)));
  const noReg=active.filter(c=>!c.regNo);
  const rookie=noReg.length?noReg[noReg.length-1]:null; // 最も新しく入った未付番の子＝入団したて
  let ri=0;
  active.forEach(c=>{ if(c.regNo||c===rookie) return; c.regNo=REG[ri++]||String(600+ri); });
  // 日付計算（タイムゾーンの影響を受けないローカル計算）
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const shift = (iso, days, months) => { if(!iso) return ''; const [y,m,dd]=iso.split('-').map(Number); const d=new Date(y,m-1,dd); if(months) d.setMonth(d.getMonth()+months); if(days) d.setDate(d.getDate()+days); return fmt(d); };
  // 参加費（1種目あたり・リレー除く）… 予定表PDFの参加料より。宇部リレーカーニバル(e_y3)は参加料が未記載のため空のまま
  const FEE = { e_y1:550, e_y2:550, e_y4:200, e_y5:900, e_y6:1000, e_y7:550, e_y8:0, e_y9:880, e_y10:800, e_y11:550, e_y12:550, e_y13:800, e_y14:550 };
  (db.events||[]).forEach(e=>{
    // 参加費の初期入力（未設定のもののみ）
    if(FEE[e.id]!==undefined && (e.feePerEvent===null || e.feePerEvent===undefined || e.feePerEvent==='')) e.feePerEvent = FEE[e.id];
    // 締切未設定の補完：団内締切＝提出締切の約1ヶ月前、団内申込開始＝団内締切の2週間前
    if(!e.clubClose && e.hostClose) e.clubClose = shift(e.hostClose, 0, -1);
    if(!e.clubOpen  && e.clubClose) e.clubOpen  = shift(e.clubClose, -14, 0);
    // ここから過去大会（お試し用）
    if(!e.date || e.date>=CUT) return;
    e.status='done';
    // 主催者への提出も完了した記録
    e.submission={ done:true, date:(e.hostClose||e.clubClose||e.date), submittedBy:by,
      memo:'（お試し用サンプル：提出済み）', docsUrl:'', enteredBy:by, updatedAt:nowJST() };
    // 参加状況：みらいふスタジアム開催（強化記録会を除く）＝4年以上が参加／それ以外＝全学年から約半数
    const elig=(e.rules&&e.rules.eligibility)?e.rules.eligibility:db.clubSettings.defaultEligibility;
    const grades=eligibleGrades(elig);
    const seniorOnly = /みらいふ/.test(venName(e.venueId)) && !/強化記録会/.test(e.name||'');
    const isTrack = (e.type==='track');
    const kyoka = /強化記録会/.test(e.name||''); // 強化記録会は男女とも800m、それ以外は男子1000m・女子800m
    const kids=(db.children||[]).filter(c=>c.status==='active'&&grades.includes(c.grade));
    kids.forEach((c,i)=>{
      if((db.participations||[]).some(p=>p.eventId===e.id&&p.childId===c.id)) return;
      const join = seniorOnly ? (c.grade>=4) : (i%2===0); // 4年以上 or 交互で約半数
      let evItems=[];
      if(join && isTrack){
        const kind = kyoka ? '800' : (c.gender==='男' ? '1000' : '800');
        const item = kind+'m';
        evItems=[item];
        if(!(db.records||[]).some(r=>r.eventId===e.id&&r.childId===c.id&&r.item===item)){
          db.records.push({ id:uid('r'), childId:c.id, item, mark:mkMark(kind,c.grade, i*3 + Number(e.date.slice(5,7))),
            date:e.date, eventName:e.name, eventId:e.id, grade:c.grade, rank:null, enteredBy:by, updatedAt:nowJST() });
        }
      }
      db.participations.push({ id:uid('p'), eventId:e.id, childId:c.id,
        status: join?'participate':'decline', events:evItems, relay:'no', attend:'no', category:null,
        enteredBy:by, updatedAt:nowJST() });
    });
  });
  // 受付中の大会は、役員デモ用に数名だけ回答済みにしておく（全員未回答を避け、母数表示も分かりやすく）
  (db.events||[]).forEach(e=>{
    if(e.status!=='open') return;

// お試し用の記録タイム生成（適当だが学年で緩やかに変化）。kind:'800'|'1000'
function mkMark(kind, grade, seed){
  const base = kind==='1000' ? 205 : 158;      // 6年生の目安（秒）
  const perGrade = kind==='1000' ? 12 : 9;      // 1学年下がるごとに遅くなる秒数
  const sec = base + (6-grade)*perGrade + ((seed*13+3)%10);
  const m = Math.floor(sec/60), s = sec - m*60;
  return `${m}:${s.toFixed(2).padStart(5,'0')}`;
}

// 画像を縮小して JPEG data URL 化（スマホ写真をそのまま保存すると重いため）
function fileToImageDataUrl(file, maxDim=1600, quality=0.7){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight;
        if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality)); };
      img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file); });
}
function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

// --- CSV文字列化（Excelで文字化けしないよう UTF-8 BOM を付ける） ---
function csvField(v){ const s=String(v??''); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function rowsToCSV(rows){ return '﻿'+rows.map(r=>r.map(csvField).join(',')).join('\r\n'); }

// --- CSVパース（引用符・改行・カンマ対応） ---
function parseCSV(text){
  const rows=[]; let row=[], field='', i=0, q=false;
  text=text.replace(/\r\n?/g,'\n');
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } q=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ q=true; i++; continue; }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

// --- 文字コード自動判定（UTF-8 / Shift-JIS）でファイルを読む ---
function decodeBytes(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) return new TextDecoder('utf-8').decode(b.subarray(3));
  const u=new TextDecoder('utf-8',{fatal:false}).decode(b);
  if(u.includes('�')){ try{ return new TextDecoder('shift_jis').decode(b); }catch(e){ return u; } }
  return u;
}

// --- 日付の正規化（2026/9/23 等 → 2026-09-23／不正はnull／空は''） ---
function normalizeDate(s){
  s=String(s??'').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m){ const p=x=>String(x).padStart(2,'0'); return `${m[1]}-${p(m[2])}-${p(m[3])}`; }
  const d=new Date(s); if(!isNaN(d)){ const p=x=>String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
  return null;
}
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); const p=x=>String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

// --- iCalendar(.ics) 生成：大会本体＋クラブ内申込締切 ---
function icsEsc(s){ return String(s??'').replace(/([\\;,])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){ const d=new Date(); const p=x=>String(x).padStart(2,'0');
  return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}Z`; }
function eventICSBlocks(e){
  const v=getVenue(e.venueId); const stamp=icsStamp(); const blocks=[];
  const loc = v ? `${v.name} ${v.address||''}`.trim() : '';
  const desc = [
    v?`会場: ${v.name}`:'',
    (e.meetPlace||v?.meetPlace)?`集合: ${e.meetPlace||v.meetPlace}`:'',
    `参加資格: ${resolveRule(e,'eligibility')}`,
    e.fee!=null?`参加費: ${e.fee}円`:'',
    eventDeadline(e)?`申込締切: ${fmtDate(eventDeadline(e))}`:'',
    e.docsUrl?`資料: ${e.docsUrl}`:'',
    e.note||''
  ].filter(Boolean).join('\n');
  if(e.date){
    blocks.push(['BEGIN:VEVENT',`UID:${e.id}@rikujo-clubhouse`,`DTSTAMP:${stamp}`,
      `SUMMARY:${icsEsc('🏃'+e.name)}`,`DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${addDays(e.date,1).replace(/-/g,'')}`,
      loc?`LOCATION:${icsEsc(loc)}`:'',`DESCRIPTION:${icsEsc(desc)}`,'END:VEVENT'].filter(Boolean).join('\r\n'));
  }
  const dl=eventDeadline(e);
  if(dl){
    blocks.push(['BEGIN:VEVENT',`UID:${e.id}-deadline@rikujo-clubhouse`,`DTSTAMP:${stamp}`,
      `SUMMARY:${icsEsc('【締切】'+e.name+' 申込')}`,`DTSTART;VALUE=DATE:${dl.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${addDays(dl,1).replace(/-/g,'')}`,'END:VEVENT'].join('\r\n'));
  }
  return blocks;
}
function buildICS(events){
  const body=events.flatMap(eventICSBlocks).join('\r\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RikujoClubhouse//JP','CALSCALE:GREGORIAN',
    'X-WR-CALNAME:陸上クラブ 大会',body,'END:VCALENDAR'].join('\r\n');
}
// --- Googleカレンダー「予定を追加」リンク（APIなし・1クリックで追加画面へ） ---
function gcalLink(e){
  const v=getVenue(e.venueId);

      r.onclick=()=>go('apply',{eventId:e.id, childId:c.id});
      box.appendChild(r);
    });
  }else{
    box.appendChild(el(`<div class="note note-info" style="margin-top:10px">🟢 いま回答が必要な大会はありません。</div>`));
  }
  return box;
}

/* ---------- 役員ホーム：今日やること（#49） ---------- */
function OfficerTodoCard(){
  const box = el(`<div class="card edge-officer">
    <h2 class="tag-officer">👨‍💼 今日やること</h2>
    <p class="sub">受付中の大会から要対応を自動集計しています。</p>
  </div>`);
  const items=[];
  const md = e => fmtMD(e.date); // 先頭に付ける月日
  const CL_ANSWER='color:var(--s-alert);font-weight:700';  // 未回答＝赤
  const CL_PAY='color:#c2410c;font-weight:700';            // 未払い＝オレンジ
  DB.events.filter(e=>e.status!=='draft' && e.status!=='done').forEach(e=>{
    const label = e.type==='road'?'未報告':'未回答';
    if(e.status==='open'){
      const s=eventResponseSummary(e);
      if(s.notanswered>0) items.push(['🔴',`${md(e)} ${e.name} ${label} ${s.notanswered}名（${s.target}名中）`,{name:'responses',p:{eventId:e.id}},CL_ANSWER]);
      const d=daysUntil(eventDeadline(e));
      if(d!==null && d>=0 && d<=3) items.push(['🟠',`${md(e)} ${e.name} 申込締切あと${d}日`,{name:'lineText',p:{eventId:e.id}},'']);
      const over=DB.children.filter(c=>c.status==='active').some(c=>{ const p=getParticipation(e.id,c.id); return p&&p.status==='participate'&&checkLimit(e,p.events||[],p.relay).over; });
      if(over) items.push(['🔴',`${md(e)} ${e.name} 出場制限の超過あり`,{name:'responses',p:{eventId:e.id}},'']);
    }
    if(feeApplies(e)){ const ps=paymentSummary(e); if(ps.unpaid>0) items.push(['💰',`${md(e)} ${e.name} 未払い ${ps.unpaid}名（${yen(ps.unpaidAmt)}）`,{name:'payments',p:{eventId:e.id}},CL_PAY]); }
    const dd=daysUntil(eventDeadline(e));
    if(dd!==null && dd<0 && !(e.submission&&e.submission.done)) items.push(['🟠',`${md(e)} ${e.name} 申込完了の記録が未`,{name:'submission',p:{eventId:e.id}},'']);
    if(recordsNeeded(e)){ const rp=recordsProgress(e); items.push(['🔴',`${md(e)} ${e.name} 記録入力が未（${rp.entered}/${rp.total}）`,{name:'recordEntry',p:{eventId:e.id}},'']); }
  });
  if(!items.length){ box.appendChild(el(`<div class="note note-info" style="margin-top:8px">🟢 いま対応が必要な項目はありません。</div>`)); return box; }
  items.forEach(([ic,txt,to,st])=>{
    const r=el(`<div class="row" style="margin-top:8px"><span style="font-size:18px">${ic}</span><div class="main"><b style="${st||''}">${esc(txt)}</b></div><span class="chev">›</span></div>`);
    r.onclick=()=>go(to.name,to.p); box.appendChild(r);
  });
  return box;
}

/* =============================================================
   大会申し込み（Phase 3）— 参加/不参加・種目・リレー・帯同
   ============================================================= */
// 回答の状態（対象外は自動判定 / 記録なし＝未回答）
const ANSWER = {
  ineligible: { label:'対象外',   cls:'b-common soft' },
  notanswered:{ label:'未回答',   cls:'b-alert' },
  participate:{ label:'参加',     cls:'b-officer' },
  decline:    { label:'不参加',   cls:'b-common' },
  canceled:   { label:'キャンセル',cls:'b-warn' },
};
// ロードは「参加→申込済み」「未回答→未報告」と言い換える
function answerLabel(ev, st){
  const t=terms(ev);
  if(st==='participate') return t.part;
  if(st==='notanswered') return t.na;
  return ANSWER[st].label;
}
const RELAY_OPTS = [
  ['priority','リレーに優先して出たい'],
  ['ifneeded','個人種目を優先。人数不足ならリレーも可'],
  ['no','リレーには出ない'],
];
const relayLabel = v => (RELAY_OPTS.find(o=>o[0]===v)||[,'—'])[1];
const attendLabel = v => v==='yes'?'できる':(v==='no'?'できない':'—');
// 駅伝の出場意思（リレーと同じ3択。チーム編成はコーチ陣が直前に行う＝アプリ対象外）
const EKIDEN_OPTS = [
  ['priority','出場する'],
  ['ifneeded','人数が足りなければ出場する'],
  ['no','出場しない'],
];
const ekidenLabel = v => (EKIDEN_OPTS.find(o=>o[0]===v)||[,'—'])[1];

const getParticipation = (eventId,childId)=> DB.participations.find(p=>p.eventId===eventId && p.childId===childId);
function childAnswerState(ev, child){
  const grades = eligibleGrades(resolveRule(ev,'eligibility'));
  if(!grades.includes(child.grade)) return 'ineligible';
  const p = getParticipation(ev.id, child.id);
  return p ? p.status : 'notanswered';
}
function eventResponseSummary(ev){
  const t = { participate:0, decline:0, notanswered:0, ineligible:0, canceled:0, target:0 };
  DB.children.filter(c=>c.status==='active').forEach(c=>{
    const s = childAnswerState(ev,c); t[s]++; if(s!=='ineligible') t.target++;
  });
  return t;
}
// 出場制限チェック（#19）
function checkLimit(ev, selEvents, relayChoice){
  const N = resolveRule(ev,'indivEvents');
  const relayRule = resolveRule(ev,'relay');
  const relayCounts = relayRule==='リレーを含めて数える';
  const relayWants = relayChoice && relayChoice!=='no';
  const count = selEvents.length + (relayCounts && relayWants ? 1 : 0);
  return { over: count>N, limit:N, count, relayCounts, relayRule };
}
function saveParticipation(eventId, childId, data){
  const p = getParticipation(eventId, childId);
  if(p) Object.assign(p, data, { updatedAt:nowJST() });
  else DB.participations.push({ id:uid('p'), eventId, childId, ...data, updatedAt:nowJST() });
  save();
}
// 家庭への請求額（種目数×単価。リレーは団費なので家庭に請求しない。ロードは団で徴収しない=null）
function childFee(ev, p){
  if(ev.type==='track'){ if(!p || p.status!=='participate') return 0; return (p.events?.length||0) * (ev.feePerEvent||0); }
  if(roadIsClub(ev)){ if(!p || p.status!=='participate') return 0; return ev.feeFlat||0; } // 団を通して申込＝1人あたり定額
  return null; // 各自申込ロード／駅伝は家庭に個別請求しない
}
// 参加費の説明表示
function feeSummaryText(ev){
  if(ev.type==='road'){
    if(ev.applyMethod==='club') return ev.feeFlat!=null?`1人 ${ev.feeFlat.toLocaleString()}円（団を通して申込）`:'団を通して申込（参加費 未設定）';
    return '各自で主催者へお支払い（団での徴収なし）';
  }
  if(ev.type==='ekiden') return ev.relayTeamFee?`団費（1チーム ${ev.relayTeamFee.toLocaleString()}円）／家庭への請求なし`:'団費（家庭への請求なし）';
  if(ev.feePerEvent==null) return '未設定';
  return `1種目 ${ev.feePerEvent.toLocaleString()}円`+(ev.relayTeamFee?`／リレーは団費（1チーム ${ev.relayTeamFee.toLocaleString()}円）`:'');
}
// 部門の自動割当（学年×性別 / 低中高学年×性別）。manualはnull
function autoCategory(ev, child){
  const sex = child.gender==='男'?'男子':'女子';
  if(ev.categoryRule==='gradeSex') return `${child.grade}年${sex}の部`;
  if(ev.categoryRule==='bandSex'){ const b=child.grade<=2?'低学年':(child.grade<=4?'中学年':'高学年'); return `${b}${sex}の部`; }
  return null;
}
// この大会の部門一覧（自動ルールなら生成、手動なら登録リスト）
function categoriesForEvent(ev){
  if(ev.categoryRule==='gradeSex') return [1,2,3,4,5,6].flatMap(g=>[`${g}年男子の部`,`${g}年女子の部`]);
  if(ev.categoryRule==='bandSex') return ['低学年','中学年','高学年'].flatMap(b=>[`${b}男子の部`,`${b}女子の部`]);
  return ev.categories||[];
}
// ロードの部門ごとの報告人数
function categoryCounts(ev){
  const map={}; categoriesForEvent(ev).forEach(c=>map[c]=0);
  DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate' && p.category).forEach(p=>{ map[p.category]=(map[p.category]||0)+1; });
  return map;
}
// 駅伝：出場する／人数不足なら可 の内訳
function ekidenBreakdown(ev){
  let priority=0, ifneeded=0;
  DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate').forEach(p=>{
    if(p.ekidenWish==='priority') priority++; else if(p.ekidenWish==='ifneeded') ifneeded++;
  });
  return { priority, ifneeded };
}

/* ===== Phase 4：役員運営（支払い・リレー編成・申込完了・LINE文面） ===== */
const PAY_STATUS = { unpaid:{label:'未払い',cls:'b-alert'}, paid:{label:'支払済',cls:'b-done'}, exempt:{label:'免除',cls:'b-common soft'} };

// 支払い対象＝トラック or 団を通して申込のロード（金額を持つ参加者）
const feeApplies = ev => ev.type==='track' || roadIsClub(ev);
function paymentList(ev){
  if(!feeApplies(ev)) return [];
  return DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate')
    .map(p=>({ p, child:getChild(p.childId), fee:childFee(ev,p) }))
    .filter(x=>x.child)
    .sort((a,b)=> (a.p.payStatus==='unpaid'?0:1)-(b.p.payStatus==='unpaid'?0:1) || b.child.grade-a.child.grade);
}
function paymentSummary(ev){
  const rows=paymentList(ev); const t={count:rows.length,total:0,paid:0,paidAmt:0,unpaid:0,unpaidAmt:0,exempt:0};
  rows.forEach(({p,fee})=>{ t.total+=fee;
    if(p.payStatus==='paid'){ t.paid++; t.paidAmt+=fee; }
    else if(p.payStatus==='exempt'){ t.exempt++; }
    else { t.unpaid++; t.unpaidAmt+=fee; }
  });
  return t;
}
const yen = n => (n||0).toLocaleString()+'円';

// リレー編成の対象か（トラックでリレーあり）
const relayOffered = ev => ev.type==='track' && resolveRule(ev,'relay')!=='リレーなし';
// リレー候補（希望＝priority/人数不足なら可＝ifneeded の参加者）
function relayCandidates(ev){
  const cand = DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate' && (p.relay==='priority'||p.relay==='ifneeded'))
    .map(p=>({ p, child:getChild(p.childId) })).filter(x=>x.child);
  return { priority:cand.filter(x=>x.p.relay==='priority'), ifneeded:cand.filter(x=>x.p.relay==='ifneeded') };
}

// LINE文面（締切前／締切後）
function lineVenueName(ev){ const v=getVenue(ev.venueId); return v?v.name:'（会場未定）'; }
function lineTextBefore(ev){
  const s=eventResponseSummary(ev); const ans = ev.type==='road'?'部門の報告':'参加・不参加の回答';
  return `【${ev.name}（${fmtDate(ev.date)}）お申し込みのお願い】\n`+

    `▼大会ページ（詳細・申し込み）\n［アプリの大会ページのリンクをここに貼ってください］`;
}
function lineTextAfter(ev){
  const s=eventResponseSummary(ev); const partLabel = ev.type==='road'?'申込済み':(ev.type==='ekiden'?'出場':'参加');
  let t=`【${ev.name} 申込締切のご報告】\n`+

  const meet = ev.meetPlace || (getVenue(ev.venueId)?.meetPlace) || '（当日ご案内します）';
  t+=`当日の集合場所：${meet}\n持ち物・スケジュールは大会ページをご確認ください。\nどうぞよろしくお願いします。`;
  return t;
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした。手動で選択してください。')); }
  else alert('この環境では自動コピーできません。文面を選択してコピーしてください。');

/* ===== Phase 5：記録・自己ベスト ===== */
// タイム文字列 → 秒（"13.92" / "2:35.21" 対応）。パース不可はnull
function parseMark(mark){
  if(mark==null) return null; let s=String(mark).trim(); if(!s) return null;
  if(s.includes(':')){ const [m,sec]=s.split(':'); const mm=Number(m), ss=Number(sec); return (isNaN(mm)||isNaN(ss))?null:mm*60+ss; }
  const n=Number(s); return isNaN(n)?null:n;
}
const childItemRecords = (childId,item)=> DB.records.filter(r=>r.childId===childId && r.item===item);
function childBestSeconds(childId,item){ const secs=childItemRecords(childId,item).map(r=>parseMark(r.mark)).filter(v=>v!=null); return secs.length?Math.min(...secs):null; }
// この記録は自己ベストか（種目は全てタイム＝小さいほど良い）
function isPB(rec){ const s=parseMark(rec.mark); if(s==null) return false; const best=childBestSeconds(rec.childId,rec.item); return best!=null && s<=best; }
const getRecord = (eventId,childId,item)=> DB.records.find(r=>r.eventId===eventId && r.childId===childId && r.item===item);
// 記録入力の進捗（トラック参加者×登録種目）
function recordRows(ev){
  const parts=DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate');
  if(ev.type==='track'){
    const rows=[];
    parts.forEach(p=>{ const child=getChild(p.childId); if(!child) return; (p.events||[]).forEach(item=>rows.push({child,item,cat:''})); });
    return rows;
  }
  // ロード/駅伝：1児童＝1行、記録の種別(item)は大会名でまとめる
  return parts.map(p=>({ child:getChild(p.childId), item:ev.name, cat:p.category||'' })).filter(r=>r.child);
}
function recordsProgress(ev){ const rows=recordRows(ev); const entered=rows.filter(r=>getRecord(ev.id,r.child.id,r.item)).length; return { total:rows.length, entered }; }
const recordsNeeded = ev => (daysUntil(ev.date)<0 || ev.status==='done') && recordRows(ev).length>0 && recordsProgress(ev).entered<recordRows(ev).length;
// エントリーシート（主催者提出用・Excel/CSV）。参加者を書き出す
function entrySheetRows(ev){
  const parts=DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate')
    .map(p=>({p,child:getChild(p.childId)})).filter(x=>x.child)
    .sort((a,b)=> b.child.grade-a.child.grade || a.child.kana.localeCompare(b.child.kana,'ja'));
  if(ev.type==='track'){
    const rows=[['氏名','ふりがな','学年','性別','種目','参加費(円)']];
    parts.forEach(({p,child})=>{ const items=p.events||[];
      if(!items.length) rows.push([child.name,child.kana,child.grade+'年',child.gender,'（種目未選択）','']);
      else items.forEach(it=>rows.push([child.name,child.kana,child.grade+'年',child.gender,it,ev.feePerEvent!=null?ev.feePerEvent:'']));
    });
    return rows;
  }
  if(ev.type==='ekiden'){
    return [['氏名','ふりがな','学年','性別','出場希望'], ...parts.map(({p,child})=>[child.name,child.kana,child.grade+'年',child.gender,ekidenLabel(p.ekidenWish)])];
  }
  // road / クロカン：部門（未選択なら自動割当で補完）
  return [['氏名','ふりがな','学年','性別','部門'], ...parts.map(({p,child})=>[child.name,child.kana,child.grade+'年',child.gender, p.category||autoCategory(ev,child)||''])];
}
function downloadEntrySheet(ev){
  const rows=entrySheetRows(ev);
  if(rows.length<=1){ alert('参加者がまだいません。'); return; }
  downloadFile(`エントリー_${ev.name}.csv`, rowsToCSV(rows), 'text/csv;charset=utf-8');
}

/* 大会申込書（クラブの公式様式に合わせた列で書き出し）— トラック向け */
function toKatakana(s){ return String(s||'').replace(/[ぁ-ゖ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)); }
function fmtRefMark(m){ return String(m||'').replace(':','.'); } // 2:35.21 → 2.35.21（様式に合わせる）
function entryEventLabel(child, item){ return `${child.grade}年${child.gender==='男'?'男子':'女子'}${item}`; } // 例）6年男子1000m
function entryFormRows(ev){
  const header=['登録番号','名字','名字ﾌﾘｶﾞﾅ','学年','所属','種目1','参考記録','種目2','参考記録','リレー','参考記録'];
  const rows=[header]; const club=DB.clubSettings.clubName||'';
  DB.participations.filter(p=>p.eventId===ev.id && p.status==='participate')
    .map(p=>({p,child:getChild(p.childId)})).filter(x=>x.child)
    .sort((a,b)=> b.child.grade-a.child.grade || a.child.kana.localeCompare(b.child.kana,'ja'))
    .forEach(({p,child})=>{
      const evs=(p.events||[]); const e1=evs[0], e2=evs[1];
      const relayOn = relayOffered(ev) && p.relay && p.relay!=='no';
      rows.push([
        child.regNo||'', child.name, toKatakana(child.kana), child.grade, club,
        e1?entryEventLabel(child,e1):'', e1?fmtRefMark(bestMark(child.id,e1)||''):'',
        e2?entryEventLabel(child,e2):'', e2?fmtRefMark(bestMark(child.id,e2)||''):'',
        relayOn?'リレー':'', ''
      ]);
    });
  return rows;
}
function downloadEntryForm(ev){
  const rows=entryFormRows(ev);
  if(rows.length<=1){ alert('参加者（種目選択済み）がまだいません。'); return; }
  downloadFile(`大会申込書_${ev.name}.csv`, rowsToCSV(rows), 'text/csv;charset=utf-8');
}

/* 記録入力用のExcel（CSV）テンプレート＝参加者一覧に既存記録を入れて書き出し */
function downloadRecordTemplate(ev){
  const rows=recordRows(ev);
  if(!rows.length){ alert('記録を入力する参加者がいません。'); return; }
  const grid=[['児童ID(変更しないでください)','氏名','学年','種目/大会', ev.type==='track'?'タイム':'完走タイム','順位']];
  rows.forEach(({child,item})=>{ const rec=getRecord(ev.id,child.id,item);
    grid.push([child.id, child.name, child.grade+'年', item, rec?rec.mark:'', (rec&&rec.rank!=null)?rec.rank:'']); });
  downloadFile(`記録_${ev.name}.csv`, rowsToCSV(grid), 'text/csv;charset=utf-8');
}
/* 記録のCSV取り込み（児童ID＋種目/大会 で照合して upsert） */
function importRecordsCSV(ev, text){
  const grid=parseCSV(text); if(grid.length<2) return { applied:0, errors:['データ行がありません。'] };
  const header=grid[0].map(h=>String(h).trim());
  const col=(...keys)=>header.findIndex(h=>keys.some(k=>h.includes(k)));
  const idOf=col('児童ID'), nameOf=col('氏名'), itemOf=col('種目','大会'), timeOf=col('タイム'), rankOf=col('順位');
  if(idOf<0||itemOf<0) return { applied:0, errors:['見出し（児童ID／種目・大会）が見つかりません。テンプレートを使ってください。'] };
  const valid=new Set(recordRows(ev).map(r=>r.child.id+''+r.item));
  let applied=0; const errors=[];
  for(let i=1;i<grid.length;i++){ const g=grid[i];
    const cid=String(g[idOf]||'').trim(), item=String(g[itemOf]||'').trim();
    if(!cid&&!item) continue;
    if(!valid.has(cid+''+item)){ errors.push(`${(nameOf>=0?g[nameOf]:'')||cid}／${item}：参加者一覧にないためスキップ`); continue; }
    const mark=String(timeOf>=0?(g[timeOf]||''):'').trim();
    const rankRaw=String(rankOf>=0?(g[rankOf]||''):'').trim();
    const rank=rankRaw===''?null:Number(rankRaw.replace(/[^0-9]/g,''));
    if(mark && parseMark(mark)==null) errors.push(`${cid}／${item}：タイム「${mark}」が読めません（そのまま保存）`);
    const child=getChild(cid); const existing=getRecord(ev.id,cid,item);
    if(mark || (rank!=null && !isNaN(rank))){
      const val={ mark, rank:(rank!=null&&!isNaN(rank))?rank:null, grade:child?child.grade:'', enteredBy:Session.userId, updatedAt:nowJST() };
      if(existing) Object.assign(existing,val);
      else DB.records.push({ id:uid('r'), childId:cid, item, ...val, date:ev.date, eventName:ev.name, eventId:ev.id });
      applied++;
    } else if(existing){ DB.records=DB.records.filter(r=>r!==existing); applied++; }
  }
  return { applied, errors };
}

// 一般会員から見た大会の状態（並び替え用の order と 表示バッジ）
// order 0=未返答 / 1=受付前 / 2=返答済み / 3=終了・対象外（時系列で混在表示）
function memberEventTier(ev){
  const grades = eligibleGrades(resolveRule(ev,'eligibility'));
  const mine = childrenOfGuardian(Session.user().guardianId).filter(c=>c.status==='active' && grades.includes(c.grade));
  const ended = (ev.status==='closed' || ev.status==='done');
  const endMark = ended ? ' <span class="badge b-common soft">申込み終了</span>' : '';
  // 対象外（この家庭に対象学年の子がいない）→ 終了・対象外グループへ
  if(!mine.length) return { order:3, badge:`<span class="badge b-common soft">学年が参加対象外</span>${endMark}` };
  // 受付中：まだ返答がない子がいれば「未返答」、全員返答済みなら申込み済／不参加
  if(ev.status==='open'){
    const todo = mine.some(c=>childAnswerState(ev,c)==='notanswered');
    if(todo) return { order:0, badge:'<span class="badge b-alert">未返答</span>' };
    const join = mine.some(c=>childAnswerState(ev,c)==='participate');
    return { order:2, badge: join ? '<span class="badge b-officer">申込み済</span>' : '<span class="badge b-common soft">不参加</span>' };
  }
  if(ev.status==='preopen') return { order:1, badge:'<span class="badge b-warn">受付前</span>' };
  // 終了（締切・開催済み）→ 申込み内容のマーク＋「申込み終了」
  const join = mine.some(c=>childAnswerState(ev,c)==='participate');
  const decline = mine.some(c=>childAnswerState(ev,c)==='decline');
  const st = join ? '<span class="badge b-officer">申込み済</span>'
            : decline ? '<span class="badge b-common soft">不参加</span>'
            : '<span class="badge b-common soft">申込みなし</span>';
  return { order:3, badge:`${st}${endMark}` };
}

function ruleLine(ev,key){
  const def = RULE_DEFS[key];
  const val = def.fmt(resolveRule(ev,key));
  const over = isOverridden(ev,key);
  return `<div class="row" style="cursor:default; margin-top:8px">
    <div class="main"><small>${def.label}</small><b>${esc(val)}</b></div>
    ${over?`<span class="badge b-warn">🟠 今回だけ変更</span>`:`<span class="badge b-common soft">デフォルト</span>`}
  </div>`;
}

/* 大会要項・会場図（写真/PDF）カード — 役員は追加/削除、全員が閲覧 */
function EventDocsCard(e, canEdit){
  const card=el(`<div class="card"><h3>📄 大会要項・会場図</h3><p class="sub">写真やPDFを${canEdit?'追加・':''}確認できます。</p></div>`);

    const pick=el(`<label class="btn btn-officer" style="cursor:pointer;display:inline-flex">📎 資料を追加（写真・PDF）
      <input type="file" accept="image/*,application/pdf" multiple style="display:none"></label>`);
    pick.querySelector('input').onchange=async (evt)=>{
      const files=[...evt.target.files]; evt.target.value='';
      for(const f of files){
        try{
          let kind, dataUrl;
          if(f.type.startsWith('image/')){ kind='image'; dataUrl=await fileToImageDataUrl(f); }
          else if(f.type==='application/pdf'){ kind='pdf'; if(f.size>4*1024*1024) alert(`「${f.name}」は容量が大きい（約${Math.round(f.size/1048576)}MB）ため、試作版では保存できないことがあります。`); dataUrl=await fileToDataUrl(f); }
          else { alert(`「${f.name}」は写真かPDFを選んでください。`); continue; }
          e.docs.push({ id:uid('d'), name:f.name, kind, dataUrl, enteredBy:Session.userId, updatedAt:nowJST() });
          if(!trySave()){ e.docs.pop(); alert('保存容量の上限を超えました。写真の枚数を減らすか、PDFは小さいものにしてください。（本番サーバー接続で解消します）'); break; }
        }catch(err){ alert('読み込みに失敗しました：'+(err&&err.message||err)); }
      }
      render();
    };
    card.appendChild(pick);
    card.appendChild(el(`<div class="note note-warn" style="margin-top:8px;font-size:12px">⚠️ 試作版では、追加した資料は<b>この端末（ブラウザ）内だけ</b>に保存されます。他の役員・保護者の端末には表示されません。全員での共有は本番サーバー接続で対応します。</div>`));
  }
  if(!e.docs || !e.docs.length){
    card.appendChild(el(`<div class="note note-info" style="margin-top:8px">まだ資料がありません。${canEdit?'上のボタンから写真やPDFを追加できます（スマホは撮影も選べます）。':'役員が追加するとここに表示されます。'}</div>`));
    return card;
  }
  const grid=el(`<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px"></div>`);
  e.docs.forEach(d=>{
    const cell=el(`<div style="width:112px"></div>`);
    if(d.kind==='image'){
      cell.appendChild(el(`<a href="${d.dataUrl}" target="_blank" rel="noopener"><img src="${d.dataUrl}" alt="${esc(d.name)}" style="width:112px;height:112px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`));
    }else{
      cell.appendChild(el(`<a href="${d.dataUrl}" target="_blank" rel="noopener" class="btn" style="width:112px;height:112px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-decoration:none"><span style="font-size:34px">📄</span><span style="font-size:11px">PDFを開く</span></a>`));
    }
    cell.appendChild(el(`<div style="font-size:11px;color:var(--muted);word-break:break-all;margin-top:4px">${esc(d.name)}</div>`));
    if(canEdit){ const del=el(`<button class="btn btn-danger" style="padding:4px 8px;font-size:12px;margin-top:4px;width:100%">削除</button>`); del.onclick=()=>{ if(confirm('この資料を削除しますか？')){ e.docs=e.docs.filter(x=>x!==d); save(); render(); } }; cell.appendChild(del); }
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  return card;
}

      <p class="sub">出場の意思（出場する／人数が足りなければ出場する／出場しない）を回答します。<b>チーム編成・区間は当日コーチ陣が決定</b>します。参加資格：<b>${esc(resolveRule(e,'eligibility'))}</b></p></div>`));
  }

  const ekiden = e.type==='ekiden';
  const T = terms(e); const label = T.ans; const partLabel = T.part;
  if(canEdit){
    if(e.type==='track'){
      const j = judgeEligibility(e);
      const elig = el(`<div class="card"><h3>🎯 参加資格の自動判定</h3>
        <p class="sub">名簿と照合して自動計算（在籍児童）。資格：<b>${esc(j.eligibility)}</b></p>
        <div class="btn-row">
          <span class="badge b-officer">対象 ${j.eligible.length}名</span>
          <span class="badge b-common soft">対象外 ${j.ineligible.length}名</span></div></div>`);
      if(j.ineligible.length){
        const det = el(`<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted);font-size:13px">対象外の児童を見る（${j.ineligible.length}名）</summary></details>`);
        j.ineligible.forEach(x=>det.appendChild(el(`<div class="row" style="cursor:default;margin-top:6px"><div class="main"><b>${esc(x.child.name)}</b><small>${x.child.grade}年 ・ ${esc(x.reason)}</small></div></div>`)));
        elig.appendChild(det);
      }
      box.appendChild(elig);
    }
    const s = eventResponseSummary(e);
    const rc = el(`<div class="card"><h3>📊 ${label}状況</h3>
      <p class="sub">対象 ${s.target}名（対象外・未${label}・${partLabel}・不参加を区別）</p>
      <div class="btn-row">
        ${s.notanswered?`<span class="badge b-alert">🔴 未${label} ${s.notanswered}</span>`:`<span class="badge b-done">未${label} 0</span>`}
        <span class="badge b-officer">${partLabel} ${s.participate}</span>
        <span class="badge b-common soft">不参加 ${s.decline}</span>
        ${s.canceled?`<span class="badge b-warn">キャンセル ${s.canceled}</span>`:''}
        <span class="badge b-common soft">対象外 ${s.ineligible}</span>
      </div></div>`);
    const openResp = el(`<button class="btn btn-officer" style="margin-top:10px">${label}状況を見る・代理入力</button>`);
    openResp.onclick = ()=>go('responses',{eventId:e.id});
    rc.appendChild(openResp);
    box.appendChild(rc);
    if(ekiden){
      const bd = ekidenBreakdown(e);
      box.appendChild(el(`<div class="card"><h3>🎽 出場意思の内訳</h3>
        <div class="btn-row">
          <span class="badge b-officer">出場する ${bd.priority}名</span>
          <span class="badge b-warn">人数不足なら可 ${bd.ifneeded}名</span></div>
        <div class="hint" style="margin-top:8px">合計 ${bd.priority+bd.ifneeded}名が出場に前向きです。チーム編成はコーチ陣が当日行います。</div></div>`));
    }
    // 役員運営メニュー（この大会）
    const ops=el(`<div class="card edge-officer"><h3>🟢 役員運営（この大会）</h3></div>`);
    const mkOp=(labelHtml,to)=>{ const b=el(`<button class="btn big" style="text-align:left;margin-top:8px">${labelHtml}</button>`); b.onclick=()=>go(to,{eventId:e.id}); ops.appendChild(b); };
    if(feeApplies(e)){ const ps=paymentSummary(e); mkOp(`💰 支払い管理${ps.unpaid?`　<span class="badge b-alert">未払い${ps.unpaid}</span>`:''}`,'payments'); }
    if(relayOffered(e)){ const rc=relayCandidates(e); mkOp(`🏃 リレー編成　<span class="badge b-common soft">候補${rc.priority.length+rc.ifneeded.length}名</span>`,'relay'); }
    { const rp=recordsProgress(e); if(rp.total>0) mkOp(`📈 記録入力　<span class="badge ${rp.entered<rp.total?'b-warn':'b-common soft'}">${rp.entered}/${rp.total}</span>`,'recordEntry'); }
    const es=el(`<button class="btn big" style="text-align:left;margin-top:8px">📄 エントリーシート書き出し（Excel/CSV）</button>`);
    es.onclick=()=>downloadEntrySheet(e); ops.appendChild(es);
    if(e.type==='track'){ const ef=el(`<button class="btn big" style="text-align:left;margin-top:8px">📋 大会申込書（公式様式）で書き出し</button>`); ef.onclick=()=>downloadEntryForm(e); ops.appendChild(ef); }
    mkOp(`📤 申込完了の記録　${e.submission&&e.submission.done?'<span class="badge b-done">完了済</span>':'<span class="badge b-warn">未完了</span>'}`,'submission');
    mkOp('✉️ LINE文面（締切前・締切後）','lineText');
    const dup=el(`<button class="btn big" style="text-align:left;margin-top:8px">📋 この大会を複製して新規作成（来年用など）</button>`);
    dup.onclick=()=>{
      if(!confirm('この大会の設定（大会名・タイプ・ルール・部門・参加費・会場・日程）をコピーして、新しい大会を作成します。回答・記録・申込完了は引き継ぎません。よろしいですか？')) return;
      const copy=JSON.parse(JSON.stringify(e));
      copy.id=uid('e'); copy.status='preopen'; copy.submission=null; copy.relayTeams=[];
      copy.enteredBy=Session.userId; copy.updatedAt=nowJST();
      DB.events.push(copy); save();
      go('eventEdit',{id:copy.id});
      alert('複製しました。開催日・締切などを調整して保存してください。');
    };
    ops.appendChild(dup);
    box.appendChild(ops);
  }else{
    box.appendChild(MemberApplyCard(e));
  }

  // 大会要項・会場図（写真/PDF）
  box.appendChild(EventDocsCard(e, canEdit));

  // 会場・集合・要項
  const info = el(`<div class="card"><h3>🗺️ 会場・当日情報</h3></div>`);
  const meet = e.meetPlace || (v&&v.meetPlace) || '—';
  info.appendChild(el(`<div class="row" style="cursor:default"><div class="main"><small>集合</small><b>${e.meetTime?esc(e.meetTime)+'　':''}${esc(meet)}${(e.meetPlace&&v&&e.meetPlace!==v.meetPlace)?' <span class="badge b-warn">今回変更</span>':''}</b></div></div>`));
  if(v){
    info.appendChild(el(`<div class="row" style="margin-top:8px"><div class="main"><small>会場</small><b>${esc(v.name)}</b></div><span class="chev">›</span></div>`));
    info.lastElementChild.onclick = ()=>go('venueDetail',{id:v.id});
  }
  if(e.outline) info.appendChild(el(`<div class="row" style="cursor:default;margin-top:8px"><div class="main"><small>大会要項</small><b>${esc(e.outline)}</b></div></div>`));
  if(e.docsUrl) info.appendChild(el(`<a class="row" href="${esc(e.docsUrl)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;margin-top:8px"><div class="main"><small>大会要項・会場図（リンク）</small><b style="word-break:break-all;color:var(--c-member)">${esc(e.docsUrl)} ↗</b></div></a>`));
  if(e.note) info.appendChild(el(`<div class="note note-info" style="margin-top:8px">📝 ${esc(e.note)}</div>`));
  box.appendChild(info);

  // メタ + 編集
  if(canEdit){
    box.appendChild(el(`<div class="card"><div class="meta" style="border-top:0;padding-top:0">
      <span>記入者：<b>${esc(userName(e.enteredBy))}</b></span>
      <span>最終更新：<b>${fmtDateTime(e.updatedAt)}</b></span></div></div>`));
    // 右下に常に表示される編集ボタン（スクロールしても付いてくる）
    const fab = el(`<button class="btn btn-officer" style="position:fixed;right:16px;bottom:16px;z-index:60;width:auto;border-radius:999px;padding:12px 20px;box-shadow:0 4px 16px rgba(0,0,0,.28)">✏️ この大会を編集</button>`);
    fab.onclick = ()=>go('eventEdit',{id:e.id});
    box.appendChild(fab);
    box.appendChild(el(`<div style="height:64px"></div>`)); // FABに隠れないための余白
  }else{
    box.appendChild(el(`<div class="meta"><span>最終更新：<b>${fmtDateTime(e.updatedAt)}</b></span></div>`));
  }
  return box;
}

function EventEditScreen(){
  if(!Session.can('officer')){ const b=el('<div class="stack"></div>'); b.appendChild(el(`<div class="note note-warn">大会の登録・編集は役員以上のみ可能です。</div>`)); return b; }
  const editing = !!route.params.id;
  const e = editing ? getEvent(route.params.id)
    : { name:'', type:'track', date:'', venueId:DB.venues[0]?.id||'', clubOpen:'',clubClose:'',hostClose:'',
        feePerEvent:'', relayTeamFee:'', categories:[], status:'preopen',
        rules:{eligibility:null,indivEvents:null,relay:null,eventCatalog:null}, meetPlace:'',outline:'',docsUrl:'',note:'' };
  const box = el('<div class="stack"></div>');
  let cats = [...(e.categories||[])];

  const venueOpts = DB.venues.map(v=>`<option value="${v.id}" ${e.venueId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
  const statusOpts = Object.entries(EVENT_STATUS).map(([k,l])=>`<option value="${k}" ${e.status===k?'selected':''}>${l}</option>`).join('');
  const typeOpts = Object.entries(EVENT_TYPE).map(([k,l])=>`<option value="${k}" ${e.type===k?'selected':''}>${l}</option>`).join('');
  const ruleSelect = (key) => {
    const def=RULE_DEFS[key]; const cur=e.rules?.[key];
    const opts=[`<option value="" ${(cur===null||cur===undefined||cur==='')?'selected':''}>${def.fmt(def.def())}（デフォルト）</option>`]
      .concat(def.opts.map(o=>`<option value="${o}" ${String(cur)===String(o)?'selected':''}>${def.fmt(o)}</option>`));
    return `<select class="f" id="r_${key}">${opts.join('')}</select>`;
  };

  const form = el(`<div class="card edge-officer">
    <h2>${editing?'✏️ 大会の編集':'＋ 大会の登録'}</h2>
    <label class="f">大会タイプ</label><select class="f" id="e_type">${typeOpts}</select>
    <label class="f">大会名</label><input class="f" id="e_name" value="${esc(e.name)}" placeholder="○○記録会">
    <label class="f">開催日</label><input class="f" id="e_date" type="date" value="${esc(e.date)}">
    <label class="f">会場</label><select class="f" id="e_venue">${venueOpts||'<option value="">（会場を先に登録）</option>'}</select>
    <label class="f">ステータス</label><select class="f" id="e_status">${statusOpts}</select>

    <div class="section-h" style="margin-top:14px"><h2>締切</h2><div class="line"></div></div>
    <label class="f">クラブ内 申込開始</label><input class="f" id="e_open" type="date" value="${esc(e.clubOpen)}">
    <label class="f">クラブ内 申込締切</label><input class="f" id="e_close" type="date" value="${esc(e.clubClose)}">
    <label class="f">主催者 締切</label><input class="f" id="e_host" type="date" value="${esc(e.hostClose)}">

    <div id="dyn"></div>

    <div class="section-h" style="margin-top:14px"><h2>当日情報・メモ</h2><div class="line"></div></div>
    <label class="f">集合場所（空欄なら会場の標準を使用）</label><input class="f" id="e_meet" value="${esc(e.meetPlace)}" placeholder="例）今回だけ北ゲート集合">
    <label class="f">集合時刻</label><input class="f" id="e_metime" type="time" value="${esc(e.meetTime||'')}">
    <label class="f">大会要項（メモ）</label><textarea class="f" id="e_outline">${esc(e.outline)}</textarea>
    <label class="f">資料リンク（要項・会場図URL）</label><input class="f" id="e_docs" value="${esc(e.docsUrl)}" placeholder="https://...">
    <label class="f">クラブ独自メモ</label><textarea class="f" id="e_note">${esc(e.note)}</textarea>
    <div class="hint">記入者（${esc(Session.user().name)}）と最終更新日時は保存時に自動記録されます。</div>
  </div>`);
  box.appendChild(form);
  const dyn=form.querySelector('#dyn');

  const trackSection = ()=>`
    <div class="section-h" style="margin-top:14px"><h2>参加費</h2><div class="line"></div></div>
    <label class="f">個人種目 1種目あたり（円）</label><input class="f" id="e_fpe" type="number" value="${e.feePerEvent!=null&&e.feePerEvent!==''?e.feePerEvent:''}" placeholder="500">
    <label class="f">リレー 1チームあたりの団費（円）</label><input class="f" id="e_rtf" type="number" value="${e.relayTeamFee!=null&&e.relayTeamFee!==''?e.relayTeamFee:''}" placeholder="1000">
    <div class="hint">家庭への請求＝<b>種目数×単価</b>。リレーは団費のため家庭には請求しません。</div>
    <div class="section-h" style="margin-top:14px"><h2>大会ルール（デフォルト＋例外）</h2><div class="line"></div></div>
    <div class="hint">変更しなければデフォルトのまま。変更した項目は大会ページでオレンジ表示されます。</div>
    <label class="f">参加資格</label>${ruleSelect('eligibility')}
    <label class="f">個人種目</label>${ruleSelect('indivEvents')}
    <label class="f">リレー</label>${ruleSelect('relay')}`;
  const roadSection = ()=>`
    <div class="section-h" style="margin-top:14px"><h2>申込方法</h2><div class="line"></div></div>
    <label class="f">申込のしかた</label>
    <select class="f" id="r_apply">
      <option value="self" ${e.applyMethod!=='club'?'selected':''}>各自で申込 → 団へ報告</option>
      <option value="club" ${e.applyMethod==='club'?'selected':''}>団を通して申し込む</option>
    </select>
    <div id="roadApplyNote"></div>
    <div class="section-h" style="margin-top:14px"><h2>参加資格</h2><div class="line"></div></div>
    <label class="f">参加資格</label>${ruleSelect('eligibility')}
    <div class="section-h" style="margin-top:14px"><h2>部門</h2><div class="line"></div></div>
    <label class="f">部門の決め方</label>
    <select class="f" id="r_catrule">
      <option value="gradeSex" ${e.categoryRule==='gradeSex'?'selected':''}>学年×性別で自動（例：3年男子の部）</option>
      <option value="bandSex" ${e.categoryRule==='bandSex'?'selected':''}>低・中・高学年×性別で自動（例：中学年男子の部）</option>
      <option value="manual" ${e.categoryRule==='manual'?'selected':''}>手動でリストを作る（家庭が選ぶ）</option>
    </select>
    <div id="catRuleNote"></div>
    <div id="catEditor">
      <div class="btn-row" id="catGen" style="margin:8px 0"></div>
      <div id="catList"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="f" id="catInput" placeholder="部門名を入力（例：3年女子の部）" style="flex:1"><button class="btn btn-officer" id="catAdd" type="button">追加</button></div>
    </div>`;
  function renderCats(){
    const list=dyn.querySelector('#catList'); if(!list) return;
    list.innerHTML = cats.length ? '' : '<div class="hint">部門が未設定です。上のボタンで自動生成するか、下で追加してください。</div>';
    cats.forEach((c,i)=>{
      const row=el(`<div class="row" style="cursor:default;margin-bottom:6px"><div class="main"><b>${esc(c)}</b></div><button class="btn btn-danger" type="button" style="padding:6px 10px">×</button></div>`);
      row.querySelector('button').onclick=()=>{ cats.splice(i,1); renderCats(); };
      list.appendChild(row);
    });
  }
  function wireRoad(){
    const gen=dyn.querySelector('#catGen');
    const addUnique=arr=>{ arr.forEach(c=>{ if(!cats.includes(c)) cats.push(c); }); renderCats(); };
    const b1=el(`<button class="btn" type="button">学年×男女を生成</button>`);
    b1.onclick=()=>addUnique([1,2,3,4,5,6].flatMap(g=>[`${g}年男子の部`,`${g}年女子の部`]));
    const b2=el(`<button class="btn" type="button">低/中/高学年×男女を生成</button>`);
    b2.onclick=()=>addUnique(['低学年','中学年','高学年'].flatMap(g=>[`${g}男子の部`,`${g}女子の部`]));
    const b3=el(`<button class="btn btn-ghost" type="button">全部クリア</button>`);
    b3.onclick=()=>{ cats=[]; renderCats(); };
    gen.append(b1,b2,b3);
    dyn.querySelector('#catAdd').onclick=()=>{ const inp=dyn.querySelector('#catInput'); const v=inp.value.trim(); if(v&&!cats.includes(v)){ cats.push(v); inp.value=''; renderCats(); } };
    renderCats();
    // 申込方法による案内・参加費欄の切替
    const applySel=dyn.querySelector('#r_apply'); const note=dyn.querySelector('#roadApplyNote');
    const syncApply=()=>{
      if(applySel.value==='club'){
        note.innerHTML=`<div class="note note-info" style="margin-top:8px">団がまとめて申し込みます。各家庭は<b>参加の可否と部門</b>を回答。参加費は団で徴収します。</div>
          <label class="f">参加費（1人あたり・円）</label><input class="f" id="e_flat" type="number" value="${e.feeFlat!=null&&e.feeFlat!==''?e.feeFlat:''}" placeholder="300">
          <div class="hint">支払い管理の対象になります。</div>`;
      }else{
        note.innerHTML=`<div class="note note-info" style="margin-top:8px">各家庭が主催者へ直接申込。団へは<b>申し込んだ部門を報告</b>してもらいます。参加費は団では徴収しません。</div>`;
      }
    };
    applySel.onchange=syncApply; syncApply();
    // 部門の決め方（自動なら手動エディタを隠す）
    const catSel=dyn.querySelector('#r_catrule'), catEditor=dyn.querySelector('#catEditor'), catNote=dyn.querySelector('#catRuleNote');
    const syncCatRule=()=>{
      if(catSel.value==='manual'){ catEditor.style.display=''; catNote.innerHTML=''; }
      else{ catEditor.style.display='none'; catNote.innerHTML=`<div class="note note-info" style="margin-top:8px">部門は名簿の<b>学年・性別から自動で割り当て</b>られます。家庭は選ばなくてOK（必要なら申込時に変更可）。エントリーシートにも自動で反映されます。</div>`; }
    };
    catSel.onchange=syncCatRule; syncCatRule();
  }
  const ekidenSection = ()=>`
    <div class="note note-info" style="margin-top:14px">駅伝は<b>出場の意思（3択）</b>で回答してもらいます。チーム編成・区間は当日コーチ陣が行うため、アプリでは扱いません。</div>
    <div class="section-h" style="margin-top:14px"><h2>参加資格</h2><div class="line"></div></div>
    <label class="f">参加資格</label>${ruleSelect('eligibility')}
    <div class="section-h" style="margin-top:14px"><h2>費用（団費）</h2><div class="line"></div></div>
    <label class="f">1チームあたりの団費（円）</label><input class="f" id="e_rtf" type="number" value="${e.relayTeamFee!=null&&e.relayTeamFee!==''?e.relayTeamFee:''}" placeholder="3000">
    <div class="hint">駅伝の費用は団費のため、家庭には請求しません。</div>`;
  function syncType(){
    const t=form.querySelector('#e_type').value;
    dyn.innerHTML = t==='road' ? roadSection() : (t==='ekiden' ? ekidenSection() : trackSection());
    if(t==='road') wireRoad();
  }
  form.querySelector('#e_type').onchange=syncType;
  syncType();

  const actions = el(`<div class="stack"></div>`);
  const saveBtn = el(`<button class="btn btn-officer big">保存する</button>`);
  saveBtn.onclick = ()=>{
    const name=$('#e_name').value.trim(); if(!name){ alert('大会名を入力してください'); return; }
    const type=form.querySelector('#e_type').value;
    const numv=id=>{ const x=form.querySelector(id); if(!x||x.value==='') return null; const n=Number(x.value); return isNaN(n)?null:n; };
    const rv=k=>{ const x=form.querySelector('#r_'+k); if(!x) return e.rules?.[k]??null; const v=x.value; return v===''?null:(k==='indivEvents'?Number(v):v); };
    const catRule = type==='road' ? (form.querySelector('#r_catrule')?.value||'gradeSex') : null;
    if(type==='road' && catRule==='manual' && cats.length===0){ if(!confirm('部門が未設定です。このまま保存しますか？（後から追加できます）')) return; }
    const data = {
      name, type, date:$('#e_date').value, venueId:$('#e_venue').value, status:$('#e_status').value,
      clubOpen:$('#e_open').value, clubClose:$('#e_close').value, hostClose:$('#e_host').value,
      feePerEvent: type==='track'?numv('#e_fpe'):null,
      relayTeamFee: (type==='track'||type==='ekiden')?numv('#e_rtf'):null,
      applyMethod: type==='road' ? (form.querySelector('#r_apply')?.value||'self') : null,
      categoryRule: catRule,
      feeFlat: (type==='road' && form.querySelector('#r_apply')?.value==='club') ? numv('#e_flat') : null,
      categories: (type==='road' && catRule==='manual') ? [...cats] : [],
      rules:{ eligibility:rv('eligibility'),
        indivEvents: type==='track'?rv('indivEvents'):(e.rules?.indivEvents??null),
        relay: type==='track'?rv('relay'):(e.rules?.relay??null),
        eventCatalog: e.rules?.eventCatalog||null },
      meetPlace:$('#e_meet').value.trim(), meetTime:$('#e_metime').value, outline:$('#e_outline').value.trim(),
      docsUrl:$('#e_docs').value.trim(), note:$('#e_note').value.trim(),
      enteredBy:Session.userId, updatedAt:nowJST(),
    };
    if(editing) Object.assign(getEvent(e.id), data);
    else DB.events.push({ id:uid('e'), ...data });
    save(); back();
  };
  actions.appendChild(saveBtn);
  if(editing){
    const arch = el(`<button class="btn btn-danger big">この大会をアーカイブ（下書きに戻す）</button>`);
    arch.onclick = ()=>{ if(confirm('この大会を下書きに戻しますか？（削除はしません）')){ getEvent(e.id).status='draft'; getEvent(e.id).updatedAt=nowJST(); getEvent(e.id).enteredBy=Session.userId; save(); back(); } };
    actions.appendChild(arch);
  }
  box.appendChild(actions);
  return box;
}

/* ---- Excelテンプレート ダウンロード ---- */
function downloadEventTemplate(){

  const sample3 = ['サンプル大会・駅伝（消してOK）','駅伝','2026-12-13','中央公園 周回コース',

/* ---- CSV → 取り込みプレビュー用に解析・検証 ---- */
let importState = null; // {rows:[{data,action,errors,venueName}], newVenues:[names]}
function parseEventCSV(text){
  const grid = parseCSV(text);
  if(!grid.length) return { fatal:'ファイルが空です。' };
  const header = grid[0].map(x=>String(x).trim());
  // 列名 → インデックス（完全一致を優先し、similar な見出しの取り違えを防ぐ）
  const idx = {}; const used=new Set();
  EVENT_CSV_COLS.forEach(c=>idx[c.k]=-1);
  const assignPass=(pred)=> EVENT_CSV_COLS.forEach(c=>{
    if(idx[c.k]>=0) return;
    const i=header.findIndex((h,ix)=>!used.has(ix)&&pred(h,c));
    if(i>=0){ idx[c.k]=i; used.add(i); }
  });
  assignPass((h,c)=>h===c.h);                       // 1) 見出し完全一致
  assignPass((h,c)=>h===c.h.split('(')[0]);         // 2) 注釈を除いた完全一致
  assignPass((h,c)=>h.startsWith(c.h.split('(')[0])); // 3) 前方一致（最後の手段）
  if(idx.name<0 || idx.date<0) return { fatal:'「大会名」「開催日」の列が見つかりません。テンプレートの1行目（見出し）を消さないでください。' };

  const cell = (r,k)=> idx[k]>=0 ? String(r[idx[k]]??'').trim() : '';
  const knownVenues = new Set(DB.venues.map(v=>v.name));
  const newVenues = new Set();
  const rows = [];
  for(let r=1; r<grid.length; r++){
    const g=grid[r]; const errors=[];
    const name=cell(g,'name');
    if(!name){ errors.push('大会名が空'); }
    const rawDate=cell(g,'date'); const date=normalizeDate(rawDate);
    if(!rawDate) errors.push('開催日が空');
    else if(date===null) errors.push(`開催日「${rawDate}」が不正`);
    const nd = s=>{ const v=normalizeDate(s); return v===null?'__ERR__':v; };
    const clubOpen=nd(cell(g,'clubOpen')), clubClose=nd(cell(g,'clubClose')), hostClose=nd(cell(g,'hostClose'));
    [['clubOpen',clubOpen,'クラブ内申込開始'],['clubClose',clubClose,'クラブ内申込締切'],['hostClose',hostClose,'主催者締切']]
      .forEach(([k,v,l])=>{ if(v==='__ERR__') errors.push(`${l}の日付が不正`); });
    const num=(k,label)=>{ const raw=cell(g,k); if(raw==='') return {raw,val:undefined}; const v=Number(raw.replace(/[,，円\s]/g,'')); if(isNaN(v)) errors.push(`${label}「${raw}」が数値でない`); return {raw,val:isNaN(v)?undefined:v}; };
    const feePE=num('feePerEvent','種目単価'); const relayFee=num('relayTeamFee','リレー団費');
    const typeRaw=cell(g,'typeLabel'); let type=undefined;
    if(typeRaw!==''){ if(/ロード|クロカン|クロスカントリー|road|cross/i.test(typeRaw)) type='road'; else if(/駅伝|ekiden/i.test(typeRaw)) type='ekiden'; else if(/トラック|track/i.test(typeRaw)) type='track'; else errors.push(`大会タイプ「${typeRaw}」はトラック/ロード/駅伝`); }
    const catRaw=cell(g,'categories'); const categories = catRaw==='' ? undefined : catRaw.split(/[；;、,]/).map(s=>s.trim()).filter(Boolean);
    const elig=cell(g,'eligibility'); if(elig && !RULE_DEFS.eligibility.opts.includes(elig)) errors.push(`参加資格「${elig}」は選択肢外`);
    const indivRaw=cell(g,'indivEvents'); let indiv=null;
    if(indivRaw!==''){ indiv=Number(indivRaw); if(![1,2,3].includes(indiv)) errors.push(`個人種目数「${indivRaw}」は1〜3`); }
    const relay=cell(g,'relay'); if(relay && !RULE_DEFS.relay.opts.includes(relay)) errors.push(`リレー「${relay}」は選択肢外`);
    const statusLabel=cell(g,'statusLabel'); let status='preopen';
    if(statusLabel){ if(STATUS_BY_LABEL[statusLabel]) status=STATUS_BY_LABEL[statusLabel]; else errors.push(`ステータス「${statusLabel}」は選択肢外`); }
    const venueName=cell(g,'venueName');
    if(venueName && !knownVenues.has(venueName)) newVenues.add(venueName);

    // 空欄は undefined（＝更新時は変更しない）。記入した項目だけ反映する。
    const U = v => (v==='' || v===null || v==='__ERR__') ? undefined : v;
    const str = k => { const v=cell(g,k); return v===''?undefined:v; };
    const existing = DB.events.find(e=>e.name===name && e.date===date);
    const data = { name, date: date||'', type,
      venueName: venueName||undefined,
      clubOpen: U(clubOpen), clubClose: U(clubClose), hostClose: U(hostClose),
      feePerEvent: feePE.val, relayTeamFee: relayFee.val, categories,
      status: statusLabel===''?undefined:status,
      meetPlace: str('meetPlace'), outline: str('outline'), docsUrl: str('docsUrl'), note: str('note'),
      rulesRaw:{ eligibility: elig===''?undefined:elig, indivEvents: indivRaw===''?undefined:indiv, relay: relay===''?undefined:relay },
      existingId: existing?.id||null };
    rows.push({ data, errors, action: errors.length?'error':(existing?'update':'new') });
  }
  return { rows, newVenues:[...newVenues] };
}

function applyEventImport(){
  if(!importState) return;
  // 新規会場を先に作成
  const nameToId = {};
  DB.venues.forEach(v=>nameToId[v.name]=v.id);
  importState.newVenues.forEach(nm=>{
    const id=uid('v'); DB.venues.push({ id, name:nm, address:'', mapUrl:'', parking:'', gate:'', meetPlace:'', note:'', enteredBy:Session.userId, updatedAt:nowJST() }); nameToId[nm]=id;
  });
  let added=0, updated=0;
  const def=(v,d)=> v===undefined?d:v; // 新規行の初期値
  importState.rows.filter(r=>r.action!=='error').forEach(r=>{
    const d=r.data;
    if(d.existingId){
      // 更新：記入された項目だけ反映（空欄は既存を維持）
      const ex=getEvent(d.existingId);
      if(d.venueName!==undefined) ex.venueId = nameToId[d.venueName]||'';
      ['type','clubOpen','clubClose','hostClose','feePerEvent','relayTeamFee','categories','status','meetPlace','outline','docsUrl','note'].forEach(k=>{ if(d[k]!==undefined) ex[k]=d[k]; });
      ['eligibility','indivEvents','relay'].forEach(k=>{ if(d.rulesRaw[k]!==undefined) ex.rules[k]=d.rulesRaw[k]; });
      ex.enteredBy=Session.userId; ex.updatedAt=nowJST(); updated++;
    }else{
      // 新規：未記入は既定値で作成
      DB.events.push({ id:uid('e'), name:d.name, type:def(d.type,'track'), date:d.date,
        venueId: d.venueName?(nameToId[d.venueName]||''):'',
        clubOpen:def(d.clubOpen,''), clubClose:def(d.clubClose,''), hostClose:def(d.hostClose,''),
        feePerEvent:def(d.feePerEvent,null), relayTeamFee:def(d.relayTeamFee,null), categories:def(d.categories,[]),
        status:def(d.status,'preopen'),
        meetPlace:def(d.meetPlace,''), outline:def(d.outline,''), docsUrl:def(d.docsUrl,''), note:def(d.note,''),
        rules:{ eligibility:def(d.rulesRaw.eligibility,null), indivEvents:def(d.rulesRaw.indivEvents,null), relay:def(d.rulesRaw.relay,null), eventCatalog:null },
        enteredBy:Session.userId, updatedAt:nowJST() });
      added++;
    }
  });
  save(); const nv=importState.newVenues.length; importState=null;
  alert(`取り込み完了：新規 ${added}件／更新 ${updated}件${nv?`／会場 ${nv}件を新規作成`:''}`);
  route={name:'events',params:{}}; render();
}

function EventImportScreen(){
  const box = el('<div class="stack"></div>');
  if(!Session.can('officer')){ box.appendChild(el(`<div class="note note-warn">取り込みは役員以上のみ可能です。</div>`)); return box; }

  if(!importState){
    box.appendChild(el(`<div class="card edge-officer">
      <h2>⬆ Excel（CSV）から大会を取り込み</h2>
      <p class="sub">テンプレートに記入 → アップロードで一括登録できます。</p>
      <ol style="margin:0 0 10px 18px;padding:0;font-size:14px;color:var(--muted)">
        <li>下の「テンプレート」をダウンロード</li>
        <li>Excelで開いて大会を追記（1行＝1大会・見出し行は消さない）</li>
        <li>「ファイルを選ぶ」でアップロード → 内容を確認して取り込み</li>
      </ol>
    </div>`));
    const dl = el(`<button class="btn btn-officer big">⬇ Excelテンプレートをダウンロード</button>`);
    dl.onclick = downloadEventTemplate;
    box.appendChild(dl);

    const pick = el(`<label class="btn big" style="border-style:dashed;cursor:pointer">📄 記入したファイルを選ぶ（CSV）
      <input type="file" accept=".csv,text/csv" style="display:none"></label>`);
    pick.querySelector('input').onchange = (ev)=>{
      const f=ev.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload = ()=>{ try{ const text=decodeBytes(rd.result); const res=parseEventCSV(text);
        if(res.fatal){ alert(res.fatal); return; } importState=res; render();
      }catch(err){ alert('読み込みに失敗しました：'+err.message); } };
      rd.readAsArrayBuffer(f);
    };
    box.appendChild(pick);
    box.appendChild(el(`<div class="note note-info">Excelで保存し直した場合の文字化け（Shift-JIS）にも自動対応します。列の並び・見出しはそのままにしてください。</div>`));
    return box;
  }

  // プレビュー
  const rows=importState.rows;
  const ok=rows.filter(r=>r.action!=='error').length, err=rows.length-ok;
  box.appendChild(el(`<div class="card edge-officer"><h2>取り込み内容の確認</h2>
    <p class="sub">全${rows.length}行：取り込み可 ${ok}件 ／ エラー ${err}件</p>
    <div class="btn-row">
      <span class="badge b-officer">新規 ${rows.filter(r=>r.action==='new').length}</span>
      <span class="badge b-warn">更新 ${rows.filter(r=>r.action==='update').length}</span>
      <span class="badge b-alert">エラー ${err}</span>
    </div></div>`));
  if(rows.some(r=>r.action==='update')){
    box.appendChild(el(`<div class="note note-info">「更新」は<b>記入した項目だけ</b>反映します。空欄のセルは既存の内容をそのまま残します（消えません）。同じ<b>大会名＋開催日</b>の大会を更新対象と判定します。</div>`));
  }
  if(importState.newVenues.length){
    box.appendChild(el(`<div class="note note-info">未登録の会場を新規作成します：<b>${importState.newVenues.map(esc).join('、')}</b></div>`));
  }
  const tbl=el(`<div class="card"><div class="table-scroll"><table class="t">
    <thead><tr><th>判定</th><th>大会名</th><th>開催日</th><th>会場</th><th>ステータス</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=tbl.querySelector('tbody');
  rows.forEach(r=>{
    const badge = r.action==='error'?`<span class="badge b-alert">⚠️エラー</span>`
      : r.action==='update'?`<span class="badge b-warn">更新</span>`:`<span class="badge b-officer">新規</span>`;
    const detail = r.action==='error'?`<div style="color:var(--s-alert);font-size:12px">${esc(r.errors.join(' / '))}</div>`:'';
    tb.appendChild(el(`<tr>
      <td>${badge}</td>
      <td>${esc(r.data.name||'（空）')}${detail}</td>
      <td>${esc(r.data.date||'—')}</td>
      <td>${esc(r.data.venueName||'—')}</td>
      <td>${EVENT_STATUS[r.data.status]||'—'}</td></tr>`));
  });
  box.appendChild(tbl);

  const apply=el(`<button class="btn btn-officer big" ${ok?'':'disabled'}>この内容で取り込む（${ok}件）</button>`);
  apply.onclick = ()=>{ if(confirm(`取り込み可能な ${ok}件 を登録します。よろしいですか？`)) applyEventImport(); };
  const cancel=el(`<button class="btn btn-ghost big">やめる</button>`);
  cancel.onclick = ()=>{ importState=null; render(); };
  box.appendChild(apply); box.appendChild(cancel);
  return box;
}
